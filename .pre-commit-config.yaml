# Pre-commit hooks for Legesher
# See https://pre-commit.com for more information
# Run `pre-commit install` to set up the git hook scripts

repos:
  # General file checks
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v5.0.0
  hooks:
  - id: trailing-whitespace
    args: [--markdown-linebreak-ext=md]
  - id: end-of-file-fixer
  - id: check-yaml
    args: [--unsafe]      # Allow custom YAML tags
    exclude: ^libs/language-server/tests/fixtures/language_packs/invalid/.*\.yml$  # Exclude intentionally invalid test fixtures
  - id: check-toml
  - id: check-json
  - id: check-added-large-files
    args: [--maxkb=1000]
  - id: check-merge-conflict
  - id: check-case-conflict
  - id: mixed-line-ending
    args: [--fix=lf]
  - id: detect-private-key

  # Python linting and auto-fixing with Ruff
- repo: https://github.com/astral-sh/ruff-pre-commit
  rev: v0.14.2
  hooks:
      # Run the linter
  - id: ruff
    args: [--fix, --exit-non-zero-on-fix]
    files: ^libs/.*\.py$
      # Run the formatter
  - id: ruff-format
    files: ^libs/.*\.py$

  # Type checking with mypy (optional - can be slow)
  # Uncomment to enable strict type checking on every commit
  # - repo: https://github.com/pre-commit/mirrors-mypy
  #   rev: v1.13.0
  #   hooks:
  #     - id: mypy
  #       files: ^libs/(i18n|legesher)/.*\.py$
  #       additional_dependencies:
  #         - pydantic>=2.0
  #         - types-PyYAML>=6.0
  #         - packaging>=23.0
  #       args: [--config-file=libs/i18n/pyproject.toml]

  # Markdown linting
- repo: https://github.com/igorshubovych/markdownlint-cli
  rev: v0.43.0
  hooks:
  - id: markdownlint
    args: [--fix]
    exclude: ^(\.claude/|libs/i18n/context/|libs/i18n/docs/|libs/vs-code/|scripts/|docs/src/content/|docs/development/)

  # YAML formatting
- repo: https://github.com/macisamuele/language-formatters-pre-commit-hooks
  rev: v2.14.0
  hooks:
  - id: pretty-format-yaml
    args: [--autofix, --indent=2, --preserve-quotes]   # keep meaningful quotes (e.g. language: "no" — a YAML 1.1 boolean in PyYAML)
    exclude: ^(\.github/workflows/.*\.yml|\.github/dependabot\.yml|libs/language-server/tests/fixtures/language_packs/invalid/.*\.yml|libs/i18n/language-packs/.*/packs/.*\.yml|.*pnpm-lock\.yaml)$      # Don't auto-format GitHub Actions, Dependabot config, invalid test fixtures, language pack files, or pnpm lockfiles (auto-generated)

  # Custom language pack YAML validation
- repo: local
  hooks:
  - entry: uv run python libs/i18n/scripts/validate_language_pack_yaml.py
    files: ^libs/i18n/language-packs/.*/packs/.*\.yml$
    id: validate-language-pack-yaml
    language: system
    name: Validate Language Pack YAML
    pass_filenames: true

  # Data-contract gate (CORE-1453): packs are data, not code. Size cap,
  # tag/anchor-free YAML, top-level key allowlist, http(s)-only metadata
  # URLs, and the render-vs-execute round-trip on the merged pack. Walks
  # the whole pack tree (merged-pack checks cross file boundaries), so
  # pass_filenames is off; the pack-file trigger keeps it out of unrelated
  # commits.
  - entry: bash -c 'cd libs/i18n && uv run python -m legesher_i18n.scripts.enforce_data_contract --quiet'
    files: ^libs/i18n/language-packs/.*/packs/.*\.yml$
    id: enforce-pack-data-contract
    language: system
    name: Enforce Pack Data Contract
    pass_filenames: false

  # Untranslated-terms gate (CORE-1021): flags pack entries whose translation
  # equals the source term (key == value), net of the intentional-loanword
  # allowlist (libs/i18n/scripts/translate/untranslated_allowlist.yml).
  # Runs --warn-only (report mode) while da:stopiteration awaits native-review
  # triage — drop the flag to flip the gate strict once the pending list in
  # libs/i18n/docs/quality-gates.md clears.
  - entry: uv run python libs/i18n/scripts/translate/find_untranslated.py --warn-only
    files: ^libs/i18n/language-packs/.*/packs/.*\.yml$
    id: find-untranslated-terms
    language: system
    name: Find Untranslated Terms
    pass_filenames: true

  # Style-guide schema + languages.json consistency validation. Runs on both
  # style-guide edits AND languages.json edits (a change to the case/rtl source
  # of truth must re-check every guide's derived flags).
  - entry: uv run python -m legesher_i18n.scripts.validate_style_guides
    files: ^libs/i18n/(style-guides/.*\.yml|legesher_i18n/languages\.json)$
    id: validate-style-guides
    language: system
    name: Validate Style Guides
    pass_filenames: false

  # Changelog enforcement: require CHANGELOG updates when version bumps
  - entry: uv run python scripts/check_changelog_on_version_bump.py
    files: (pyproject\.toml|package\.json|CHANGELOG\.md)$
    id: check-changelog-on-version-bump
    language: system
    name: Check CHANGELOG updated on version bump
    pass_filenames: false

  # Internal dependency constraint enforcement: sibling legesher-* deps in
  # workspace member pyprojects must carry a bounded version range — the
  # range ships in wheel metadata, where the [tool.uv.sources] workspace
  # override does not exist (CORE-1598)
  - entry: uv run python scripts/check_internal_dep_constraints.py
    files: pyproject\.toml$
    id: check-internal-dep-constraints
    language: system
    name: Check internal dependency version bounds
    pass_filenames: false

  # Regenerate REFERENCE.md when language pack YAML files change
  - entry: uv run python scripts/generate_reference_docs.py
    files: ^libs/i18n/language-packs/.*/packs/.*\.yml$
    id: regenerate-reference-docs
    language: system
    name: Regenerate Reference Documentation
    pass_filenames: false

  # Keep pack README count lines in step with pack contents (CORE-1014) —
  # same trigger as REFERENCE regeneration; the script is idempotent.
  - entry: uv run python scripts/update_pack_readme_counts.py
    files: ^libs/i18n/language-packs/.*/packs/.*\.yml$
    id: update-pack-readme-counts
    language: system
    name: Update Pack README Counts
    pass_filenames: false

  # Showcase example transpile check (CORE-1403): every preview-repo
  # hello_world.py must reverse-translate through its pack and ast.parse.
  # --skip-if-missing: contributors without the preview checkout aren't blocked.
  # --warn-only: 11 pre-existing example regressions at gate introduction
  # (2026-08-04 run: ar da fr hi ja no pl si sv th vi); drop the flag once
  # that list clears — same flip ritual as find-untranslated-terms.
  - entry: uv run python libs/i18n/scripts/validate_showcase_examples.py --skip-if-missing --warn-only --quiet
    files: ^libs/i18n/language-packs/.*/packs/.*\.yml$
    id: validate-showcase-examples
    language: system
    name: Validate Showcase Examples
    pass_filenames: false

  # Commit message validation with Commitizen
- repo: https://github.com/commitizen-tools/commitizen
  rev: v4.9.1
  hooks:
  - id: commitizen
    stages: [commit-msg]
  - id: commitizen-branch
    stages: [pre-push]

# Configuration for pre-commit.ci (if using)
ci:
  autofix_commit_msg: |
    [pre-commit.ci] auto fixes from pre-commit hooks

    for more information, see https://pre-commit.ci
  autofix_prs: true
  autoupdate_branch: ''
  autoupdate_commit_msg: '[pre-commit.ci] pre-commit autoupdate'
  autoupdate_schedule: weekly
  skip: []
  submodules: false

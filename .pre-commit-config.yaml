# Pre-commit hooks for Legesher
# See https://pre-commit.com for more information
# Run `pre-commit install` to set up the git hook scripts

repos:
  # General file checks
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v5.0.0
  hooks:
  - id: trailing-whitespace
    args: [--markdown-linebreak-ext=md]
  - id: end-of-file-fixer
  - id: check-yaml
    args: [--unsafe]      # Allow custom YAML tags
    exclude: ^libs/language-server/tests/fixtures/language_packs/invalid/.*\.yml$  # Exclude intentionally invalid test fixtures
  - id: check-toml
  - id: check-json
    # tsconfig/jsconfig files are JSONC — TypeScript documents comment support
    # and every editor honours it — while this hook parses strict JSON. Without
    # the exclusion the only way to land one is `--no-verify`, which is how the
    # commented tsconfig already in the tree got there, and which skips every
    # other hook on the way past.
    #
    # `.vscode/*.json` is the same case: VS Code documents its settings, launch
    # and tasks files as JSONC, and a settings file that cannot carry a comment
    # cannot say why it is relaxing a security default (CORE-1978).
    exclude: '(^|/)((ts|js)config[^/]*|\.vscode/[^/]+)\.json$'
  - id: check-added-large-files
    args: [--maxkb=1000]
  - id: check-merge-conflict
  - id: check-case-conflict
  - id: mixed-line-ending
    args: [--fix=lf]
  - id: detect-private-key

  # Python linting and auto-fixing with Ruff
- repo: https://github.com/astral-sh/ruff-pre-commit
  rev: v0.14.2
  hooks:
      # Run the linter (docs/scripts joined the scope in CORE-1583)
  - id: ruff
    args: [--fix, --exit-non-zero-on-fix]
    files: ^(libs|docs/scripts)/.*\.py$
      # Run the formatter
  - id: ruff-format
    files: ^(libs|docs/scripts)/.*\.py$

  # Type checking with mypy (optional - can be slow)
  # Uncomment to enable strict type checking on every commit
  # - repo: https://github.com/pre-commit/mirrors-mypy
  #   rev: v1.13.0
  #   hooks:
  #     - id: mypy
  #       files: ^libs/(i18n|legesher)/.*\.py$
  #       additional_dependencies:
  #         - pydantic>=2.0
  #         - types-PyYAML>=6.0
  #         - packaging>=23.0
  #       args: [--config-file=libs/i18n/pyproject.toml]

  # Markdown linting
- repo: https://github.com/igorshubovych/markdownlint-cli
  rev: v0.43.0
  hooks:
  - id: markdownlint
    args: [--fix]
    # The pack REFERENCE.md files are generated (scripts/generate_reference_docs.py)
    # and their shape is pinned by scripts/tests/test_review_template_contract.py;
    # a --fix pass over them would only create drift for make check-generated.
    exclude: ^(\.claude/|libs/i18n/context/|libs/i18n/docs/|libs/i18n/language-packs/python/[^/]+/REFERENCE\.md|libs/vs-code/|scripts/|docs/src/content/|docs/development/)

  # YAML formatting
- repo: https://github.com/macisamuele/language-formatters-pre-commit-hooks
  rev: v2.14.0
  hooks:
  - id: pretty-format-yaml
    args: [--autofix, --indent=2, --preserve-quotes]   # keep meaningful quotes (e.g. language: "no" — a YAML 1.1 boolean in PyYAML)
    exclude: ^(\.github/workflows/.*\.yml|\.github/dependabot\.yml|libs/language-server/tests/fixtures/language_packs/invalid/.*\.yml|libs/i18n/language-packs/.*/packs/.*\.yml|.*pnpm-lock\.yaml)$      # Don't auto-format GitHub Actions, Dependabot config, invalid test fixtures, language pack files, or pnpm lockfiles (auto-generated)

  # Custom language pack YAML validation
- repo: local
  hooks:
  - entry: uv run python libs/i18n/scripts/validate_language_pack_yaml.py
    files: ^libs/i18n/language-packs/.*/packs/.*\.yml$
    id: validate-language-pack-yaml
    language: system
    name: Validate Language Pack YAML
    pass_filenames: true

  # Data-contract gate (CORE-1453): packs are data, not code. Size cap,
  # tag/anchor-free YAML, top-level key allowlist, http(s)-only metadata
  # URLs, and the render-vs-execute round-trip on the merged pack. Walks
  # the whole pack tree (merged-pack checks cross file boundaries), so
  # pass_filenames is off; the pack-file trigger keeps it out of unrelated
  # commits.
  # The SHA-pinning gate moved to the zizmor hooks at the end of this file
  # (CORE-1922). scripts/check_action_pinning.py was deleted with it: zizmor's
  # `unpinned-uses` already enforced the same rule, and being a single static
  # binary it works in every repo regardless of language — which is what let
  # the "one checker per repo, per language" plan collapse.

  - entry: bash -c 'cd libs/i18n && uv run python -m legesher_i18n.scripts.enforce_data_contract --quiet'
    files: ^libs/i18n/language-packs/.*/packs/.*\.yml$
    id: enforce-pack-data-contract
    language: system
    name: Enforce Pack Data Contract
    pass_filenames: false

  # Untranslated-terms gate (CORE-1021): flags pack entries whose translation
  # equals the source term (key == value), net of the intentional-loanword
  # allowlist (libs/i18n/scripts/translate/untranslated_allowlist.yml).
  # Runs --warn-only (report mode) while da:stopiteration awaits native-review
  # triage — drop the flag to flip the gate strict once the pending list in
  # libs/i18n/docs/quality-gates.md clears.
  - entry: uv run python libs/i18n/scripts/translate/find_untranslated.py --warn-only --check-db
    files: ^libs/i18n/language-packs/.*/packs/.*\.yml$
    id: find-untranslated-terms
    language: system
    name: Find Untranslated Terms
    pass_filenames: true

  # Version gate (CORE-1655): a pack's content IS its API, so a content change
  # that leaves the version alone ships two vocabularies under one number --
  # silent, because nothing about the install looks different.
  #
  # It also requires the pack's two version declarations to agree. That half is
  # CORE-2058: 50 of 51 packs had drifted apart because the bumps moved
  # pyproject.toml and not __init__.py, and "the version changed" alone would
  # let that back in one pack at a time.
  #
  # Local rather than CI on purpose: the failure is a commit that looks
  # complete, and catching it afterwards means a published version already
  # means two things. Run with --fix to bump both files across every pack a
  # regeneration touched.
  - entry: uv run python libs/i18n/scripts/require_pack_version_bump.py
    # Version files as well as pack content. A commit that edits only
    # pyproject.toml desyncs it from __init__.py without touching a single
    # YAML, which is CORE-2058 exactly, and a content-only pattern would
    # let that commit straight through.
    files: ^libs/i18n/language-packs/[^/]+/[^/]+/(.*/packs/.*\.yml|pyproject\.toml|[^/]+/__init__\.py)$
    id: require-pack-version-bump
    language: system
    name: Require Pack Version Bump
    pass_filenames: true

  # Style-guide schema + languages.json consistency validation. Runs on both
  # style-guide edits AND languages.json edits (a change to the case/rtl source
  # of truth must re-check every guide's derived flags).
  - entry: uv run python -m legesher_i18n.scripts.validate_style_guides
    files: ^libs/i18n/(style-guides/.*\.yml|legesher_i18n/languages\.json)$
    id: validate-style-guides
    language: system
    name: Validate Style Guides
    pass_filenames: false

  # Changelog enforcement: require CHANGELOG updates when version bumps
  - entry: uv run python scripts/check_changelog_on_version_bump.py
    files: (pyproject\.toml|package\.json|CHANGELOG\.md)$
    id: check-changelog-on-version-bump
    language: system
    name: Check CHANGELOG updated on version bump
    pass_filenames: false

  # Internal dependency constraint enforcement: sibling legesher-* deps in
  # workspace member pyprojects must carry a bounded version range — the
  # range ships in wheel metadata, where the [tool.uv.sources] workspace
  # override does not exist (CORE-1598)
  - entry: uv run python scripts/check_internal_dep_constraints.py
    files: pyproject\.toml$
    id: check-internal-dep-constraints
    language: system
    name: Check internal dependency version bounds
    pass_filenames: false

  # Regenerate REFERENCE.md (the review template) when a pack's YAML, its
  # pyproject.toml version, the version index, the registry, the metadata-line
  # module or the generator changes: the
  # template pins the pack version in its header, so a bump without a
  # regeneration is drift (make check-generated-reference catches it in CI).
  - entry: uv run python scripts/generate_reference_docs.py
    files: ^(libs/i18n/language-packs/.*/packs/.*\.yml|libs/i18n/language-packs/python/[^/]+/pyproject\.toml|libs/i18n/language-packs/python/version-index\.yml|libs/i18n/legesher_i18n/languages\.json|libs/i18n/legesher_i18n/intake/review_template\.py|scripts/generate_reference_docs\.py)$
    id: regenerate-reference-docs
    language: system
    name: Regenerate Reference Documentation
    pass_filenames: false

  # Regenerate the schema v2 reference when the schema, its descriptions or
  # the generator change (CORE-2232). Fails, naming the offender, when the
  # SQL and the descriptions disagree.
  - entry: uv run python libs/i18n/scripts/generate_schema_reference.py
    files: ^libs/i18n/(legesher_i18n/db/schema_v2\.(sql|descriptions\.yml)|legesher_i18n/db/schema\.py|scripts/generate_schema_reference\.py|docs/schema-v2-reference\.md)$
    id: regenerate-schema-reference
    language: system
    name: Regenerate Schema v2 Reference
    pass_filenames: false

  # Keep pack README count lines in step with pack contents (CORE-1014) —
  # same trigger as REFERENCE regeneration; the script is idempotent.
  - entry: uv run python scripts/update_pack_readme_counts.py
    files: ^libs/i18n/language-packs/.*/packs/.*\.yml$
    id: update-pack-readme-counts
    language: system
    name: Update Pack README Counts
    pass_filenames: false

  # Showcase example transpile check (CORE-1403): every preview-repo
  # hello_world.py must reverse-translate through its pack and ast.parse.
  # --skip-if-missing: contributors without the preview checkout aren't blocked.
  # Strict since 2026-08-10 (CORE-1779) — gate status and history live in
  # libs/i18n/docs/quality-gates.md.
  - entry: uv run python libs/i18n/scripts/validate_showcase_examples.py --skip-if-missing --quiet
    files: ^libs/i18n/language-packs/.*/packs/.*\.yml$
    id: validate-showcase-examples
    language: system
    name: Validate Showcase Examples
    pass_filenames: false

  # Full GitHub Actions security audit. Run on demand, NOT on every commit:
  #     uv run pre-commit run zizmor --hook-stage manual --all-files
  # A full run reports 84 findings: 0 high, 25 medium, 1 low, 19 informational
  # (CORE-1920 cleared all 13 highs, including a real template-injection in
  # sync-reference-docs.yml). The medium tier is mostly 18 `artipacked` —
  # checkout without `persist-credentials: false` — plus 4
  # `dependabot-cooldown`. Triaging those is its own piece of work, so this
  # stays manual until it is done rather than blocking every commit. Scoping
  # it to a single rule is not a practical alternative: zizmor's `ignore:`
  # matches exact basenames with no glob support, so silencing 40 rules across
  # ~15 workflows would take ~600 lines of config. The one rule that must hold
  # today (`unpinned-uses`) is enforced by the blocking local hook below
  # instead — though note that hook reads workflow files only, and pinning is
  # really a property of the transitive action graph (CORE-1926).
- repo: https://github.com/zizmorcore/zizmor-pre-commit
  rev: v1.29.0
  hooks:
  - id: zizmor
    stages: [manual]

    # The blocking half of the SHA-pinning gate (CORE-1922). Same binary and
    # the same pinned rev as the manual hook above — only the severity floor
    # differs, so there is one zizmor version in this repo rather than two.
    #
    # `unpinned-uses` is an `error` at High confidence under zizmor's default
    # blanket policy, so --min-severity=high catches an unpinned `uses:` with
    # no configuration at all. That is what let scripts/check_action_pinning.py
    # be deleted: 73 lines reimplementing a rule already installed here.
    #
    # Severity filtering is what makes scoping practical. The note above is
    # right that per-rule `ignore:` lists would run to ~600 lines, but that is
    # an argument about `ignore:`, not about zizmor — --min-severity needs no
    # config. CORE-1920 cleared the high tier, so this passes today and fires
    # only on a regression; the 25 remaining mediums stay out of scope until
    # that triage lands.
    #
    # --no-online-audits keeps commit time offline. The transitive half of the
    # gate does need network, which is exactly why it is not a hook:
    # scripts/audit_action_graph.py resolves each `uses:` to its action.yml and
    # recurses through composite actions. A pinned SHA is immutable, so a clean
    # reference cannot rot — that walk only needs to run when a `uses:` line
    # changes, which makes it a CI job on .github/** instead.
  - id: zizmor
    alias: require-pinned-actions
    args: [--min-severity=high, --no-online-audits]
    name: Require SHA-pinned GitHub Actions

  # Commit message validation with Commitizen
- repo: https://github.com/commitizen-tools/commitizen
  rev: v4.9.1
  hooks:
  - id: commitizen
    stages: [commit-msg]
  - id: commitizen-branch
    stages: [pre-push]

# Configuration for pre-commit.ci (if using)
ci:
  autofix_commit_msg: |
    [pre-commit.ci] auto fixes from pre-commit hooks

    for more information, see https://pre-commit.ci
  autofix_prs: true
  autoupdate_branch: ''
  autoupdate_commit_msg: '[pre-commit.ci] pre-commit autoupdate'
  autoupdate_schedule: weekly
  skip: []
  submodules: false

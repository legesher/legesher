version: 2

updates:
  # ── Python (UV workspace) ──────────────────────────────
  # Monitors pyproject.toml + uv.lock for external dependencies.
  # Known limitation: path-based [tool.uv.sources] may cause some
  # parse failures (dependabot-core#13366); external deps still work.
  - package-ecosystem: uv
    directory: /
    # Wait before proposing a freshly published version. A compromised
    # or yanked release is usually caught within days, and nothing here
    # is urgent enough to be worth being first (CORE-1920).
    cooldown:
      default-days: 7
      semver-major-days: 30
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: US/Central
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
    labels:
      - dependencies
      - area:security
    reviewers:
      - MadiEdgar
    open-pull-requests-limit: 10
    groups:
      python-all:
        applies-to: version-updates
        update-types:
          - major
          - minor
          - patch
      python-security:
        applies-to: security-updates
        patterns:
          - "*"

  # ── Node.js: Documentation site (Astro + Starlight) ────
  # docs/ uses pnpm — Dependabot may not update pnpm-lock.yaml
  # automatically. Verify post-deployment; may need manual pnpm install.
  - package-ecosystem: npm
    directory: /docs
    # Wait before proposing a freshly published version. A compromised
    # or yanked release is usually caught within days, and nothing here
    # is urgent enough to be worth being first (CORE-1920).
    cooldown:
      default-days: 7
      semver-major-days: 30
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: US/Central
    commit-message:
      prefix: "chore(deps)"
    labels:
      - dependencies
      - pkg:docs
    reviewers:
      - MadiEdgar
    open-pull-requests-limit: 5
    groups:
      docs-all:
        applies-to: version-updates
        update-types:
          - major
          - minor
          - patch

  # ── Node.js: VS Code extension ─────────────────────────
  - package-ecosystem: npm
    directory: /libs/vs-code
    # Wait before proposing a freshly published version. A compromised
    # or yanked release is usually caught within days, and nothing here
    # is urgent enough to be worth being first (CORE-1920).
    cooldown:
      default-days: 7
      semver-major-days: 30
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: US/Central
    commit-message:
      prefix: "chore(deps)"
    labels:
      - dependencies
      - pkg:vs-code
    reviewers:
      - MadiEdgar
    open-pull-requests-limit: 5
    groups:
      vscode-all:
        applies-to: version-updates
        update-types:
          - major
          - minor
          - patch

  # ── GitHub Actions ──────────────────────────────────────
  # Updates pinned action versions across all workflows.
  - package-ecosystem: github-actions
    directory: /
    # Wait before proposing a freshly published version. A compromised
    # or yanked release is usually caught within days, and nothing here
    # is urgent enough to be worth being first (CORE-1920).
    cooldown:
      default-days: 7
      semver-major-days: 30
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: US/Central
    commit-message:
      prefix: "ci(deps)"
    labels:
      - dependencies
      - area:ci-cd
    reviewers:
      - MadiEdgar
    open-pull-requests-limit: 10
    groups:
      actions:
        patterns:
          - "*"

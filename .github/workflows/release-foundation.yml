name: Release Foundation Suite

on:
  push:
    branches:
      - main
    paths:
      - 'libs/core/**'
      - 'libs/i18n/**'
      - 'libs/legesher/**'
      - 'pyproject.toml'
  workflow_dispatch:  # Allow manual triggers

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  lint:
    name: Lint & Validate
    runs-on: ubuntu-latest
    if: "github.event_name != 'push' || (!contains(github.event.head_commit.message, 'chore(release)') && !contains(github.event.head_commit.message, 'chore: update uv.lock'))"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      - name: Run pre-commit
        uses: pre-commit/action@v3.0.1

  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    if: "github.event_name != 'push' || (!contains(github.event.head_commit.message, 'chore(release)') && !contains(github.event.head_commit.message, 'chore: update uv.lock'))"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.10', '3.13']
        exclude:
          # Only test 3.13 on macOS/Windows to save credits
          - os: macos-latest
            python-version: '3.10'
          - os: windows-latest
            python-version: '3.10'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      - name: Run core tests
        run: uv run pytest libs/core/tests/ -v

      - name: Run i18n tests
        run: uv run pytest libs/i18n/tests/ -v

      - name: Run legesher tests
        run: uv run pytest libs/legesher/tests/ -v

      - name: Run language-server tests
        run: uv run pytest libs/language-server/tests/ -v

  release:
    name: Release Foundation (core, i18n, legesher)
    runs-on: ubuntu-latest
    needs: [lint, test]
    if: "github.event_name != 'push' || (!contains(github.event.head_commit.message, 'chore(release)') && !contains(github.event.head_commit.message, 'chore: update uv.lock'))"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch all history for semantic-release
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Install dependencies
        run: |
          uv pip install --system python-semantic-release
          uv sync  # Set up workspace for building

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Run Semantic Release
        id: semantic-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "📦 Running semantic-release for foundation suite..."

          # Capture HEAD before running semantic-release
          HEAD_BEFORE=$(git rev-parse HEAD)

          # Run semantic-release
          # Note: Returns exit 0 regardless of whether a release is made
          uv run semantic-release version

          # Check if HEAD changed (meaning a release commit was created)
          HEAD_AFTER=$(git rev-parse HEAD)

          if [ "$HEAD_BEFORE" != "$HEAD_AFTER" ]; then
            echo "✅ Release created (commit: ${HEAD_AFTER:0:7})"
            echo "release_created=true" >> $GITHUB_OUTPUT
          else
            echo "ℹ️ No release needed (HEAD unchanged)"
            echo "release_created=false" >> $GITHUB_OUTPUT
          fi

      - name: Sync uv.lock
        if: steps.semantic-release.outputs.release_created == 'true'
        run: |
          echo "🔒 Syncing uv.lock..."
          uv sync

          # Commit lock file if it changed
          if [ -n "$(git status --porcelain uv.lock)" ]; then
            git add uv.lock
            git commit -m "chore: update uv.lock after version bump"
            git push origin main
          fi

      - name: Create GitHub Release
        if: steps.semantic-release.outputs.release_created == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "🚀 Creating GitHub Release..."
          uv run semantic-release publish

      - name: Build packages
        if: steps.semantic-release.outputs.release_created == 'true'
        run: |
          echo "📦 Building foundation packages..."
          cd libs/core && uv build && cd ../..
          cd libs/i18n && uv build && cd ../..
          cd libs/legesher && uv build && cd ../..

      - name: Upload build artifacts
        if: steps.semantic-release.outputs.release_created == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: foundation-dist-${{ github.sha }}
          path: |
            libs/core/dist/
            libs/i18n/dist/
            libs/legesher/dist/
          retention-days: 90

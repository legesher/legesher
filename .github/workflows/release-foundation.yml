name: Release Foundation Suite

# Lint + test jobs live in ci.yml and run on PRs and push-to-main.
# This workflow only handles the release pipeline (version bump, tag,
# artifact build, GitHub release). It does NOT wait for ci.yml on main —
# that's an accepted risk: release commits are semantic-release-gated
# (only feat/fix/breaking), so the window for a red-test-green-release
# race is narrow, and reverting is cheap if it ever bites. See CORE-1122.

on:
  push:
    branches:
      - main
    paths:
      - 'libs/core/**'
      - 'libs/i18n/**'
      - 'libs/legesher/**'
      - 'pyproject.toml'
  workflow_dispatch:  # Allow manual triggers

permissions:
  contents: write
  issues: write
  pull-requests: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  release:
    name: Release Foundation (core, i18n, legesher)
    runs-on: ubuntu-latest
    if: "github.event_name != 'push' || (!contains(github.event.head_commit.message, 'chore(release)') && !contains(github.event.head_commit.message, 'chore: update uv.lock') && !contains(github.event.head_commit.message, 'docs(changelog): stamp'))"

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0  # Fetch all history for semantic-release
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"

      - name: Install dependencies
        run: |
          uv pip install --system python-semantic-release
          uv sync  # Set up workspace for building

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Run Semantic Release
        id: semantic-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "📦 Running semantic-release for foundation suite..."

          # Capture HEAD before running semantic-release
          HEAD_BEFORE=$(git rev-parse HEAD)

          # Run semantic-release
          # Note: Returns exit 0 regardless of whether a release is made
          uv run semantic-release version

          # Check if HEAD changed (meaning a release commit was created)
          HEAD_AFTER=$(git rev-parse HEAD)

          if [ "$HEAD_BEFORE" != "$HEAD_AFTER" ]; then
            echo "✅ Release created (commit: ${HEAD_AFTER:0:7})"
            echo "release_created=true" >> $GITHUB_OUTPUT
          else
            echo "ℹ️ No release needed (HEAD unchanged)"
            echo "release_created=false" >> $GITHUB_OUTPUT
          fi

      - name: Sync uv.lock
        if: steps.semantic-release.outputs.release_created == 'true'
        run: |
          echo "🔒 Syncing uv.lock..."
          uv sync

          # Commit lock file if it changed
          if [ -n "$(git status --porcelain uv.lock)" ]; then
            git add uv.lock
            git commit -m "chore: update uv.lock after version bump"
          fi

      - name: Stamp changelogs
        if: steps.semantic-release.outputs.release_created == 'true'
        run: |
          python scripts/stamp-changelog-release.py
          git add CHANGELOG.md libs/core/CHANGELOG.md libs/i18n/CHANGELOG.md libs/legesher/CHANGELOG.md
          if [ -n "$(git diff --cached --name-only)" ]; then
            git commit -m "docs(changelog): stamp release [CORE-608]"
          fi

      - name: Push release commits
        if: steps.semantic-release.outputs.release_created == 'true'
        run: git push origin main

      - name: Create GitHub Release
        if: steps.semantic-release.outputs.release_created == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Creating GitHub Release..."
          uv run semantic-release publish

      - name: Build packages
        if: steps.semantic-release.outputs.release_created == 'true'
        run: |
          echo "📦 Building foundation packages..."
          uv build --package legesher-core --out-dir libs/core/dist/
          uv build --package legesher-i18n --out-dir libs/i18n/dist/
          uv build --package legesher --out-dir libs/legesher/dist/

      - name: Upload build artifacts
        if: steps.semantic-release.outputs.release_created == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: foundation-dist-${{ github.sha }}
          path: |
            libs/core/dist/
            libs/i18n/dist/
            libs/legesher/dist/
          retention-days: 90

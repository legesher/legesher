name: Release Foundation Suite

on:
  push:
    branches:
      - main
    paths:
      - 'libs/core/**'
      - 'libs/i18n/**'
      - 'libs/legesher/**'
      - 'pyproject.toml'
  workflow_dispatch:  # Allow manual triggers

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release:
    name: Release Foundation (core, i18n, legesher)
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, 'chore(release)')"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch all history for semantic-release
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Install dependencies
        run: |
          uv pip install --system python-semantic-release
          uv sync  # Set up workspace for building

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Check for releasable changes
        id: check-release
        run: |
          echo "🔍 Checking for releasable changes..."
          # Use --print to check if a new version would be created
          NEW_VERSION=$(uv run semantic-release version --print 2>/dev/null || echo "")
          if [ -n "$NEW_VERSION" ]; then
            echo "✅ New version detected: $NEW_VERSION"
            echo "should_release=true" >> $GITHUB_OUTPUT
            echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT
          else
            echo "ℹ️ No releasable changes found"
            echo "should_release=false" >> $GITHUB_OUTPUT
          fi

      - name: Run Semantic Release
        if: steps.check-release.outputs.should_release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "📦 Creating release ${{ steps.check-release.outputs.new_version }}..."
          uv run semantic-release version

      - name: Sync uv.lock
        if: steps.check-release.outputs.should_release == 'true'
        run: |
          echo "🔒 Syncing uv.lock..."
          uv sync

          # Commit lock file if it changed
          if [ -n "$(git status --porcelain uv.lock)" ]; then
            git add uv.lock
            git commit -m "chore: update uv.lock after version bump"
            git push origin main
          fi

      - name: Create GitHub Release
        if: steps.check-release.outputs.should_release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "🚀 Creating GitHub Release..."
          uv run semantic-release publish

      - name: Build packages
        if: steps.check-release.outputs.should_release == 'true'
        run: |
          echo "📦 Building foundation packages..."
          cd libs/core && uv build && cd ../..
          cd libs/i18n && uv build && cd ../..
          cd libs/legesher && uv build && cd ../..

      - name: Upload build artifacts
        if: steps.check-release.outputs.should_release == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: foundation-dist-${{ github.sha }}
          path: |
            libs/core/dist/
            libs/i18n/dist/
            libs/legesher/dist/
          retention-days: 90

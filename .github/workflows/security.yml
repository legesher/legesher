name: Security

on:
  pull_request:
    branches:
      - main
    # `ready_for_review` / `labeled` are not in the default type set; without
    # them the draft gate below could never open.
    types: [opened, synchronize, reopened, ready_for_review, labeled]
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bandit:
    name: Bandit (Python security linter)
    runs-on: ubuntu-latest
    # Draft PRs skip this scan; marking the PR ready fires `ready_for_review`
    # and scans the final commit. The `ci:run` label forces a run while still
    # in draft. `push` to main is unaffected.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.draft == false ||
      contains(github.event.pull_request.labels.*.name, 'ci:run')
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          version: "latest"
          enable-cache: true

      - name: Install bandit
        run: uv pip install --system "bandit[toml]"

      # Bandit runs in informational mode: findings are reported in the logs,
      # but the job only fails if a High-severity issue is introduced. The 2
      # existing High-severity findings were fixed in the PR that introduced
      # this workflow. Medium/Low findings are tracked in a follow-up ticket.
      - name: Run bandit security scan (High severity blocks CI)
        run: bandit -r libs/ -c pyproject.toml --severity-level high

      - name: Run bandit full report (informational)
        if: always()
        run: bandit -r libs/ -c pyproject.toml || true

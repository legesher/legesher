name: Release Applications

on:
  push:
    branches:
      - main
    paths:
      - 'libs/vs-code/**'
      - 'libs/pride/**'
  workflow_dispatch:
    inputs:
      app:
        description: 'Application to release'
        required: true
        type: choice
        options:
          - vs-code
          - pride

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  detect-changed-apps:
    name: Detect Changed Applications
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    outputs:
      apps: ${{ steps.detect.outputs.apps }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect changed applications
        id: detect
        run: |
          # Get changed files
          CHANGED_FILES=$(git diff --name-only HEAD~1 HEAD)

          # Find changed app directories
          APPS=$(echo "$CHANGED_FILES" | grep -E '^libs/(vs-code|pride)/' | cut -d/ -f2 | sort -u | jq -R -s -c 'split("\n") | map(select(length > 0))')

          echo "Changed apps: $APPS"
          echo "apps=$APPS" >> $GITHUB_OUTPUT

  release-app:
    name: Release ${{ matrix.app }}
    runs-on: ubuntu-latest
    needs: detect-changed-apps
    if: needs.detect-changed-apps.outputs.apps != '[]'
    strategy:
      matrix:
        app: ${{ fromJson(needs.detect-changed-apps.outputs.apps) }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Install dependencies
        run: |
          uv pip install --system python-semantic-release

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Release application
        working-directory: libs/${{ matrix.app }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "📦 Releasing legesher-${{ matrix.app }}..."
          if ! uv run semantic-release version --verbose; then
            echo "ℹ️ No release needed for ${{ matrix.app }}"
            exit 0
          fi

      - name: Create GitHub Release
        if: success()
        working-directory: libs/${{ matrix.app }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          uv run semantic-release publish --verbose

      - name: Build package
        if: success()
        run: |
          uv build -p libs/${{ matrix.app }}

      - name: Upload build artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app }}-dist-${{ github.sha }}
          path: libs/${{ matrix.app }}/dist/
          retention-days: 90

  release-manual:
    name: Manual Release ${{ github.event.inputs.app }}
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Install dependencies
        run: |
          uv pip install --system python-semantic-release

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Release application
        working-directory: libs/${{ github.event.inputs.app }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "📦 Releasing legesher-${{ github.event.inputs.app }}..."
          if ! uv run semantic-release version --verbose; then
            echo "ℹ️ No release needed"
            exit 0
          fi

      - name: Create GitHub Release
        if: success()
        working-directory: libs/${{ github.event.inputs.app }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          uv run semantic-release publish --verbose

      - name: Build package
        if: success()
        run: |
          uv build -p libs/${{ github.event.inputs.app }}

      - name: Upload build artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.inputs.app }}-dist-${{ github.sha }}
          path: libs/${{ github.event.inputs.app }}/dist/
          retention-days: 90

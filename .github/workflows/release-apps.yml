name: Release VS Code Extension

on:
  push:
    branches:
      - main
    paths:
      - 'libs/vs-code/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Job 1: Test on multiple platforms
  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: libs/vs-code
        run: npm install

      - name: Compile
        working-directory: libs/vs-code
        run: npm run compile

      - name: Run tests (Linux)
        if: runner.os == 'Linux'
        working-directory: libs/vs-code
        run: xvfb-run -a npm test
        continue-on-error: true  # Tests may not exist yet

      - name: Run tests (non-Linux)
        if: runner.os != 'Linux'
        working-directory: libs/vs-code
        run: npm test
        continue-on-error: true  # Tests may not exist yet

  # Job 2: Build and release (only on Linux after tests pass)
  release:
    name: Build and Release
    runs-on: ubuntu-latest
    needs: test
    # Skip release commits to prevent loops
    if: "!contains(github.event.head_commit.message, 'chore(release)')"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: libs/vs-code
        run: npm install

      - name: Get version from package.json
        id: version
        working-directory: libs/vs-code
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=vscode-v$VERSION" >> $GITHUB_OUTPUT

      - name: Check if tag already exists
        id: check-tag
        run: |
          if git rev-parse "refs/tags/${{ steps.version.outputs.tag }}" >/dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "::notice::Tag ${{ steps.version.outputs.tag }} already exists, skipping release"
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Build extension (production)
        if: steps.check-tag.outputs.exists == 'false'
        working-directory: libs/vs-code
        run: |
          npm run compile:prod
          npm run package

      - name: Create git tag
        if: steps.check-tag.outputs.exists == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ steps.version.outputs.tag }}" -m "Release VS Code extension v${{ steps.version.outputs.version }}"
          git push origin "${{ steps.version.outputs.tag }}"

      - name: Create GitHub Release
        if: steps.check-tag.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            --title "VS Code Extension v${{ steps.version.outputs.version }}" \
            --notes "## Legesher VS Code Extension v${{ steps.version.outputs.version }}

          Download the \`.vsix\` file below and install via:
          - **VS Code**: Extensions → ⋯ menu → Install from VSIX
          - **CLI**: \`code --install-extension legesher-vscode-${{ steps.version.outputs.version }}.vsix\`

          ### Changes
          See [CHANGELOG](https://github.com/MadiEdgar/legesher/blob/main/libs/vs-code/CHANGELOG.md) for details." \
            libs/vs-code/*.vsix

      - name: Upload artifact (backup)
        if: steps.check-tag.outputs.exists == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: legesher-vscode-${{ steps.version.outputs.version }}
          path: libs/vs-code/*.vsix
          retention-days: 90


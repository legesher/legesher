name: Release VS Code Extension

on:
  push:
    branches:
      - main
    paths:
      - 'libs/vs-code/**'
  workflow_dispatch:

# Read-only by default; only the release job opts up (CORE-1920). The
# workflow-level `contents: write` also reached the three-OS `test` job,
# which compiles and runs a test suite — the job most exposed to whatever
# the diff contains, and the one with no reason to hold a token that can
# push tags.
permissions:
  contents: read

jobs:
  # Job 1: Test on multiple platforms
  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          cache: 'npm'
          cache-dependency-path: libs/vs-code/package-lock.json
          node-version: '20'

      - name: Install dependencies
        working-directory: libs/vs-code
        run: npm ci

      - name: Compile
        working-directory: libs/vs-code
        run: npm run compile

      - name: Run tests (Linux)
        if: runner.os == 'Linux'
        working-directory: libs/vs-code
        run: xvfb-run -a npm test
        continue-on-error: true  # Tests may not exist yet

      - name: Run tests (non-Linux)
        if: runner.os != 'Linux'
        working-directory: libs/vs-code
        run: npm test
        continue-on-error: true  # Tests may not exist yet

  # Job 2: Build and release (only on Linux after tests pass)
  release:
    name: Build and Release
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: write  # git tag + GitHub release
    # Only release from main branch, skip release commits to prevent loops
    if: github.ref == 'refs/heads/main' && !contains(github.event.head_commit.message, 'chore(release)')

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          cache: 'npm'
          cache-dependency-path: libs/vs-code/package-lock.json
          node-version: '20'

      - name: Install dependencies
        working-directory: libs/vs-code
        run: npm ci

      - name: Get version from package.json
        id: version
        working-directory: libs/vs-code
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=vscode-v$VERSION" >> $GITHUB_OUTPUT

      - name: Check if tag already exists
        id: check-tag
        run: |
          if git rev-parse "refs/tags/${{ steps.version.outputs.tag }}" >/dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "::notice::Tag ${{ steps.version.outputs.tag }} already exists, skipping release"
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Build extension (production)
        if: steps.check-tag.outputs.exists == 'false'
        working-directory: libs/vs-code
        env:
          LEGESHER_TELEMETRY_CONNECTION_STRING: ${{ secrets.LEGESHER_TELEMETRY_CONNECTION_STRING }}
        run: |
          npm run compile:prod
          npm run package

      - name: Create git tag
        if: steps.check-tag.outputs.exists == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ steps.version.outputs.tag }}" -m "Release VS Code extension v${{ steps.version.outputs.version }}"
          git push origin "${{ steps.version.outputs.tag }}"

      - name: Create GitHub Release
        if: steps.check-tag.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            --title "VS Code Extension v${{ steps.version.outputs.version }}" \
            --notes "## Legesher VS Code Extension v${{ steps.version.outputs.version }}

          Download the \`.vsix\` file below and install via:
          - **VS Code**: Extensions → ⋯ menu → Install from VSIX
          - **CLI**: \`code --install-extension legesher-vscode-${{ steps.version.outputs.version }}.vsix\`

          ### Changes
          See [CHANGELOG](https://github.com/legesher/legesher/blob/main/libs/vs-code/CHANGELOG.md) for details." \
            libs/vs-code/*.vsix

      - name: Upload artifact (backup)
        if: steps.check-tag.outputs.exists == 'false'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: legesher-vscode-${{ steps.version.outputs.version }}
          path: libs/vs-code/*.vsix
          retention-days: 90

  # TODO: Deferred improvements (from Copilot review)
  # - Add 'test' script to package.json when tests are implemented
  #   (currently test steps use continue-on-error: true)
  # - Update marketplace section below to use 'npm ci' when uncommenting


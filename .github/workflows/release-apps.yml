name: Release VS Code Extension

on:
  push:
    branches:
      - main
    paths:
      - 'libs/vs-code/**'
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release-vscode:
    name: Release VS Code Extension
    runs-on: ubuntu-latest
    if: github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: libs/vs-code/package-lock.json

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Install dependencies
        working-directory: libs/vs-code
        run: npm ci

      - name: Build extension
        working-directory: libs/vs-code
        run: npm run compile:prod

      - name: Package VSIX
        working-directory: libs/vs-code
        run: npm run package

      - name: Get version
        id: version
        working-directory: libs/vs-code
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: legesher-vscode-${{ steps.version.outputs.version }}-${{ github.sha }}
          path: libs/vs-code/*.vsix
          retention-days: 90

  release-manual:
    name: Manual Release VS Code Extension
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: libs/vs-code/package-lock.json

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Install dependencies
        working-directory: libs/vs-code
        run: npm ci

      - name: Build extension
        working-directory: libs/vs-code
        run: npm run compile:prod

      - name: Package VSIX
        working-directory: libs/vs-code
        run: npm run package

      - name: Get version
        id: version
        working-directory: libs/vs-code
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: legesher-vscode-${{ steps.version.outputs.version }}-${{ github.sha }}
          path: libs/vs-code/*.vsix
          retention-days: 90

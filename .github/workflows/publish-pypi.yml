name: Publish to PyPI

on:
  # Manual trigger only - PyPI publishing disabled by default
  workflow_dispatch:
    inputs:
      package:
        description: 'Package to publish'
        required: true
        type: choice
        options:
          - foundation
          - i18n-python-es
          - i18n-python-ar
          - vs-code
          - home
      environment:
        description: 'Target environment'
        required: true
        type: choice
        default: 'testpypi'
        options:
          - testpypi
          - pypi

permissions:
  contents: read

jobs:
  publish:
    name: Publish ${{ github.event.inputs.package }} to ${{ github.event.inputs.environment }}
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.event.inputs.environment }}
      url: ${{ github.event.inputs.environment == 'pypi' && format('https://pypi.org/p/legesher-{0}', github.event.inputs.package) || format('https://test.pypi.org/p/legesher-{0}', github.event.inputs.package) }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Install build dependencies
        run: |
          uv pip install --system build twine

      - name: Build packages
        run: |
          if [ "${{ github.event.inputs.package }}" = "foundation" ]; then
            echo "📦 Building foundation packages..."
            uv build -p libs/core
            uv build -p libs/i18n
            uv build -p libs/legesher

            # Collect all foundation dist files
            mkdir -p dist
            cp libs/core/dist/* dist/
            cp libs/i18n/dist/* dist/
            cp libs/legesher/dist/* dist/
          else
            echo "📦 Building ${{ github.event.inputs.package }}..."
            uv build -p libs/${{ github.event.inputs.package }}

            # Copy to root dist for twine
            mkdir -p dist
            cp libs/${{ github.event.inputs.package }}/dist/* dist/
          fi

      - name: Check distribution
        run: |
          echo "🔍 Checking distribution files..."
          twine check dist/*

      - name: Publish to TestPyPI
        if: github.event.inputs.environment == 'testpypi'
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.TEST_PYPI_API_TOKEN }}
        run: |
          echo "🚀 Publishing to TestPyPI..."
          twine upload --repository testpypi dist/* --verbose

      - name: Publish to PyPI
        if: github.event.inputs.environment == 'pypi'
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          echo "🚀 Publishing to PyPI..."
          twine upload dist/* --verbose

      - name: Verify installation (TestPyPI)
        if: github.event.inputs.environment == 'testpypi'
        run: |
          echo "✅ Published to TestPyPI successfully!"
          echo ""
          echo "To test installation:"
          if [ "${{ github.event.inputs.package }}" = "foundation" ]; then
            echo "  pip install --index-url https://test.pypi.org/simple/ legesher-core"
            echo "  pip install --index-url https://test.pypi.org/simple/ legesher-i18n"
            echo "  pip install --index-url https://test.pypi.org/simple/ legesher"
          else
            echo "  pip install --index-url https://test.pypi.org/simple/ legesher-${{ github.event.inputs.package }}"
          fi

      - name: Verify installation (PyPI)
        if: github.event.inputs.environment == 'pypi'
        run: |
          echo "✅ Published to PyPI successfully!"
          echo ""
          echo "To install:"
          if [ "${{ github.event.inputs.package }}" = "foundation" ]; then
            echo "  pip install legesher-core"
            echo "  pip install legesher-i18n"
            echo "  pip install legesher"
          else
            echo "  pip install legesher-${{ github.event.inputs.package }}"
          fi

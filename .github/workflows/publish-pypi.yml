name: Publish to PyPI

on:
  # Manual trigger only - PyPI publishing disabled by default
  workflow_dispatch:
    inputs:
      package:
        description: 'Package to publish'
        required: true
        type: choice
        # Language pack options must match libs/i18n/legesher_i18n/languages.json (source of truth)
        options:
          - foundation
          - all-language-packs
          - i18n-python-ar
          - i18n-python-da
          - i18n-python-de
          - i18n-python-el
          - i18n-python-en
          - i18n-python-es
          - i18n-python-fi
          - i18n-python-fr
          - i18n-python-he
          - i18n-python-hi
          - i18n-python-hu
          - i18n-python-id
          - i18n-python-it
          - i18n-python-ja
          - i18n-python-ko
          - i18n-python-ms
          - i18n-python-nl
          - i18n-python-no
          - i18n-python-pl
          - i18n-python-pt
          - i18n-python-ru
          - i18n-python-sv
          - i18n-python-th
          - i18n-python-tr
          - i18n-python-vi
          - i18n-python-zh
          # legesher-lsp, the server the VS Code extension starts by default and
          # that every other editor installs itself (CORE-2203). It requires
          # legesher-i18n, so publish `foundation` to the same index first:
          # PyPI does not check dependencies at upload, only at install.
          - language-server
          # legesher-mcp, which its README installs with `uvx legesher-mcp`
          # (CORE-626 publish set). It requires legesher-core and
          # legesher-i18n, so `foundation` reaches the same index first, for
          # the same reason as `language-server` above.
          - mcp
          # legesher-runtime, the localized tracebacks the `legesher` CLI
          # requires (CORE-2351). Whenever its version is new, dispatch it
          # before `foundation`. PyPI does not check requirements at upload,
          # so it uploads before the legesher-i18n it requires; and if this
          # dispatch fails, no CLI has yet gone out requiring a runtime the
          # index lacks. A target of its own rather than part of
          # `foundation`, because `foundation` is dispatched again after
          # every foundation release while runtime's version moves by hand,
          # and re-uploading an existing file fails the publish.
          - runtime
          - vs-code
      environment:
        description: 'Target environment'
        required: true
        type: choice
        default: 'testpypi'
        options:
          - testpypi
          - pypi

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish ${{ github.event.inputs.package }} to ${{ github.event.inputs.environment }}
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.event.inputs.environment }}
      url: >-
        ${{
          (github.event.inputs.package == 'foundation' || github.event.inputs.package == 'all-language-packs')
          && (github.event.inputs.environment == 'pypi'
            && 'https://pypi.org/search/?q=legesher'
            || 'https://test.pypi.org/search/?q=legesher')
          || (github.event.inputs.environment == 'pypi'
            && format('https://pypi.org/p/legesher-{0}', github.event.inputs.package)
            || format('https://test.pypi.org/p/legesher-{0}', github.event.inputs.package))
        }}

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Load language list from source of truth
        id: langs
        run: |
          # Extract language codes from the canonical languages.json registry
          LANGS=$(python3 -c "import json; print(' '.join(sorted(json.load(open('libs/i18n/legesher_i18n/languages.json'))['languages'].keys())))")
          echo "list=$LANGS" >> "$GITHUB_OUTPUT"
          echo "Loaded languages: $LANGS"

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          version: "latest"
          # Cache deliberately OFF here, unlike every other workflow
          # (CORE-1920). The Actions cache is shared across the repository
          # and writable by lower-privileged workflows, so a cache entry
          # restored into the job that builds and uploads a release artifact
          # is an input this workflow does not control. This is a manual,
          # rare, dispatch-only publish; a cold uv install costs it seconds
          # and buys a build whose dependencies came from the index.
          enable-cache: false

      - name: Install build dependencies
        run: |
          uv pip install --system build twine

      - name: Build packages
        env:
          PACKAGE: ${{ github.event.inputs.package }}
          ALL_LANGS: ${{ steps.langs.outputs.list }}
        # Every build names its distribution with --package and its output
        # with --out-dir. A build given a path lands wherever uv's project
        # discovery puts it, and that differs by member: `uv build libs/core`
        # writes to the WORKSPACE ROOT's dist/, while a pack under libs/i18n
        # writes to its own dist/. The old path-then-copy shape therefore
        # broke `foundation` and `vs-code`, whose libs/<dir>/dist/ never
        # exists (CORE-2313). scripts/tests/test_publish_pypi_build.py runs
        # this step for every target.
        run: |
          mkdir -p dist

          if [ "$PACKAGE" = "foundation" ]; then
            echo "📦 Building foundation packages..."
            uv build --package legesher-core --out-dir dist/
            uv build --package legesher-i18n --out-dir dist/
            uv build --package legesher --out-dir dist/

          elif [ "$PACKAGE" = "all-language-packs" ]; then
            echo "📦 Building all language packs..."
            FAILED=""
            for lang in $ALL_LANGS; do
              echo "  Building i18n-python-$lang..."
              if ! uv build --package "legesher-i18n-python-$lang" --out-dir dist/; then
                echo "  ERROR: Failed to build i18n-python-$lang"
                FAILED="$FAILED $lang"
              fi
            done
            if [ -n "$FAILED" ]; then
              echo ""
              echo "❌ Failed to build:$FAILED"
              exit 1
            fi

          elif echo "$PACKAGE" | grep -q '^i18n-python-'; then
            LANG_CODE="${PACKAGE#i18n-python-}"
            # Validate against source of truth
            if ! echo " $ALL_LANGS " | grep -Fq " $LANG_CODE "; then
              echo "ERROR: Unknown language code: $LANG_CODE"
              exit 1
            fi
            echo "📦 Building $PACKAGE..."
            uv build --package "legesher-$PACKAGE" --out-dir dist/

          else
            # Only allow known non-language-pack packages. Each one's
            # distribution name is legesher-<option>.
            case "$PACKAGE" in
              language-server|mcp|runtime|vs-code) ;;
              *) echo "ERROR: Unknown package: $PACKAGE"; exit 1 ;;
            esac
            echo "📦 Building legesher-$PACKAGE..."
            uv build --package "legesher-$PACKAGE" --out-dir dist/
          fi

      - name: Check distribution
        run: |
          echo "🔍 Checking distribution files..."
          twine check dist/*

      - name: Publish to TestPyPI
        if: github.event.inputs.environment == 'testpypi'
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

      - name: Publish to PyPI
        if: github.event.inputs.environment == 'pypi'
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # release/v1

      - name: Verify installation (TestPyPI)
        if: github.event.inputs.environment == 'testpypi'
        env:
          PACKAGE: ${{ github.event.inputs.package }}
          ALL_LANGS: ${{ steps.langs.outputs.list }}
        run: |
          echo "✅ Published to TestPyPI successfully!"
          echo ""
          echo "To test installation:"
          if [ "$PACKAGE" = "foundation" ]; then
            echo "  pip install --index-url https://test.pypi.org/simple/ legesher-core"
            echo "  pip install --index-url https://test.pypi.org/simple/ legesher-i18n"
            echo "  pip install --index-url https://test.pypi.org/simple/ legesher"
          elif [ "$PACKAGE" = "all-language-packs" ]; then
            for lang in $ALL_LANGS; do
              echo "  pip install --index-url https://test.pypi.org/simple/ legesher-i18n-python-$lang"
            done
          else
            echo "  pip install --index-url https://test.pypi.org/simple/ legesher-$PACKAGE"
          fi

      - name: Verify installation (PyPI)
        if: github.event.inputs.environment == 'pypi'
        env:
          PACKAGE: ${{ github.event.inputs.package }}
          ALL_LANGS: ${{ steps.langs.outputs.list }}
        run: |
          echo "✅ Published to PyPI successfully!"
          echo ""
          echo "To install:"
          if [ "$PACKAGE" = "foundation" ]; then
            echo "  pip install legesher-core"
            echo "  pip install legesher-i18n"
            echo "  pip install legesher"
          elif [ "$PACKAGE" = "all-language-packs" ]; then
            for lang in $ALL_LANGS; do
              echo "  pip install legesher-i18n-python-$lang"
            done
          else
            echo "  pip install legesher-$PACKAGE"
          fi

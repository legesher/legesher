name: "CodeQL"

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
      actions: read

    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}

      - name: Autobuild
        uses: github/codeql-action/autobuild@v4

      - name: Perform CodeQL Analysis
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
          # SARIF upload requires GitHub Code Scanning, which requires GitHub
          # Advanced Security on private repos. This repo is on GitHub Free
          # until CORE-758 (org transfer), so upload fails until then.
          # `upload: ${{ !github.event.repository.private }}` self-heals when
          # the repo goes public — no code change needed at CORE-758. Critically,
          # this only suppresses the SARIF upload — real CodeQL analysis errors
          # still fail the step. Tracked in CORE-1122 + CORE-758.
          upload: ${{ !github.event.repository.private }}

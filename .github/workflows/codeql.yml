name: "CodeQL"

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    # `ready_for_review` / `labeled` are not in the default type set; without
    # them the draft gate below could never open.
    types: [opened, synchronize, reopened, ready_for_review, labeled]
  schedule:
    - cron: "0 6 * * 1"

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    # Draft PRs skip CodeQL — it is the most expensive job in the repo and a
    # draft is still being iterated. Marking the PR ready fires
    # `ready_for_review` and analyzes the final commit; the `ci:run` label
    # forces a run while still in draft. `push` and the weekly `schedule`
    # are unaffected, so the security baseline never depends on PR state.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.draft == false ||
      contains(github.event.pull_request.labels.*.name, 'ci:run')
    permissions:
      security-events: write
      contents: read
      actions: read

    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript]

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Initialize CodeQL
        uses: github/codeql-action/init@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v4
        with:
          languages: ${{ matrix.language }}

      - name: Autobuild
        uses: github/codeql-action/autobuild@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v4

      - name: Perform CodeQL Analysis
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: github/codeql-action/analyze@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v4
        with:
          category: "/language:${{ matrix.language }}"
          # SARIF upload requires GitHub Code Scanning, which requires GitHub
          # Advanced Security on private repos. This repo is on GitHub Free
          # until CORE-758 (org transfer), so upload fails until then.
          # `upload: ${{ !github.event.repository.private }}` self-heals when
          # the repo goes public — no code change needed at CORE-758. Critically,
          # this only suppresses the SARIF upload — real CodeQL analysis errors
          # still fail the step. Tracked in CORE-1122 + CORE-758.
          upload: ${{ !github.event.repository.private }}

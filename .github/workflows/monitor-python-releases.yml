name: Monitor Python Releases

on:
  # Manual trigger - recommended for MVP
  workflow_dispatch:
    inputs:
      python_version:
        description: 'Python version to process (e.g., 3.14)'
        required: false
        type: string
      dry_run:
        description: 'Dry run (do not create PR)'
        required: false
        type: boolean
        default: false

  # Optional: Weekly check (Mondays at noon UTC)
  # Uncomment to enable automated monitoring
  # schedule:
  #   - cron: '0 12 * * 1'

# `peter-evans/create-pull-request` needs contents + pull-requests. Nothing
# in this workflow touches the Issues API, so `issues: write` was scope this
# job never used (CORE-1920).
permissions:
  contents: write
  pull-requests: write

jobs:
  monitor-and-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: |
          cd libs/i18n
          uv sync

      - name: Check for new Python release
        id: check_release
        # `python_version` is a free-text dispatch input. Interpolated with
        # `${{ }}` it is substituted into the script before bash ever sees
        # it, so its contents become shell source. Bound through `env:` it
        # arrives as a variable value and stays data (CORE-1920).
        env:
          PYTHON_VERSION: ${{ inputs.python_version }}
        run: |
          cd libs/i18n

          # If version provided manually, use it
          if [ -n "$PYTHON_VERSION" ]; then
            VERSION="$PYTHON_VERSION"
            echo "Manual version specified: $VERSION"
          else
            # Auto-detect new version
            VERSION=$(uv run python scripts/monitor_python.py)

            if [ -z "$VERSION" ]; then
              echo "No new Python version detected"
            else
              echo "New Python version detected: $VERSION"
            fi
          fi

          # Validate BEFORE publishing to $GITHUB_OUTPUT. Binding the input
          # through `env:` in this step alone would only move the injection
          # three steps down: five later steps interpolate
          # `steps.check_release.outputs.version` straight into `run:` blocks
          # and into create-pull-request's branch / title / labels, and this
          # job holds `contents: write` + `pull-requests: write`. The output
          # is the boundary that actually matters, so the value is checked
          # here once and every consumer downstream inherits the guarantee.
          if [ -n "$VERSION" ] && ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+$'; then
            echo "::error::Refusing a Python version that is not N.N: $VERSION"
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Extract Python content
        if: steps.check_release.outputs.version != ''
        id: extract
        run: |
          cd libs/i18n
          VERSION="${{ steps.check_release.outputs.version }}"

          echo "Extracting content for Python $VERSION..."
          uv run python scripts/extract_python_content.py \
            --version "$VERSION" \
            --output "/tmp/python-content-$VERSION.json" \
            --pretty

          echo "content_file=/tmp/python-content-$VERSION.json" >> $GITHUB_OUTPUT

      - name: Generate translations
        if: steps.check_release.outputs.version != ''
        id: translate
        run: |
          cd libs/i18n
          VERSION="${{ steps.check_release.outputs.version }}"

          echo "Generating translations for Python $VERSION..."
          mkdir -p /tmp/translations

          # Generate translations for each supported language
          for LANG in es ar zh; do
            echo "Translating to $LANG..."
            uv run python scripts/translate_content.py \
              --version "$VERSION" \
              --input "${{ steps.extract.outputs.content_file }}" \
              --target-language "$LANG" \
              --output "/tmp/translations/python-$VERSION-$LANG.json" \
              --provider mock
          done

          echo "translations_dir=/tmp/translations" >> $GITHUB_OUTPUT

      - name: Generate language packs
        if: steps.check_release.outputs.version != ''
        run: |
          cd libs/i18n
          VERSION="${{ steps.check_release.outputs.version }}"

          echo "Generating language packs for Python $VERSION..."
          uv run python scripts/generate_language_pack.py \
            --version "$VERSION" \
            --input "${{ steps.extract.outputs.content_file }}" \
            --translations-dir "${{ steps.translate.outputs.translations_dir }}" \
            --languages-dir "languages"

      - name: Create Pull Request
        if: steps.check_release.outputs.version != '' && inputs.dry_run != true
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: |
            feat(i18n): add Python ${{ steps.check_release.outputs.version }} language packs

            Auto-generated language packs for Python ${{ steps.check_release.outputs.version }}:
            - Base English pack with all keywords, builtins, and types
            - Translated packs for es, ar, zh
            - Updated version-index.yml

            This PR was automatically generated by the Legesher auto-update system.

            Part of CORE-381: Auto-Update GitHub Actions Workflow

            🤖 Generated with GitHub Actions
          branch: auto-update/python-${{ steps.check_release.outputs.version }}
          delete-branch: true
          title: '[Auto-Update] Python ${{ steps.check_release.outputs.version }} Language Packs'
          body: |
            ## 🐍 Python ${{ steps.check_release.outputs.version }} Language Pack Update

            This PR automatically generates language packs for Python ${{ steps.check_release.outputs.version }}.

            ### 📦 Generated Packs
            - [x] English (en) - base pack
            - [ ] Spanish (es) - needs review
            - [ ] Arabic (ar) - needs review
            - [ ] Chinese (zh) - needs review

            ### 📊 Statistics
            Detailed statistics available in commit message and pack metadata.

            ### ✅ Checklist
            - [ ] Review base English pack
            - [ ] Review translated packs
            - [ ] Test with Legesher CLI
            - [ ] Verify version-index.yml updated correctly

            ### 🤖 Auto-generated
            This PR was created automatically by the Legesher auto-update system.

            **Workflow:** monitor-python-releases.yml
            **Trigger:** ${{ github.event_name }}
            **Run:** ${{ github.run_id }}
          labels: |
            auto-update
            python-${{ steps.check_release.outputs.version }}
            translation-needed
          assignees: madiedgar

      - name: Summary
        if: steps.check_release.outputs.version != ''
        run: |
          echo "✅ Python ${{ steps.check_release.outputs.version }} language packs generated"

          if [ "${{ inputs.dry_run }}" = "true" ]; then
            echo "ℹ️  Dry run mode - no PR created"
          else
            echo "📝 Pull request created for review"
          fi

      - name: No new version
        if: steps.check_release.outputs.version == ''
        run: |
          echo "ℹ️  No new Python version detected. Nothing to do."

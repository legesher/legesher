name: Release Language Packs

# Lint + test jobs live in ci.yml and run on PRs and push-to-main.
# This workflow only handles the per-pack release pipeline. See CORE-1122
# for the split rationale and Option B release-independence decision.

on:
  push:
    branches:
      - main
    paths:
      - 'libs/i18n/language-packs/python/**'
  workflow_dispatch:
    inputs:
      target:
        description: 'Target language (e.g., python)'
        required: true
        default: 'python'
        # `choice`, not `string` (CORE-1920). This value names a directory
        # under libs/i18n/language-packs/ and is interpolated into shell and
        # into `working-directory:`; as free text it was the one genuinely
        # unconstrained input in this workflow. `language` was already a
        # choice. Add an option here when a second target ships.
        type: choice
        options:
          - python
      language:
        description: 'Language code (e.g., es, ar)'
        required: true
        type: choice
        # Options must match libs/i18n/legesher_i18n/languages.json (source of truth)
        options:
          - am
          - ar
          - bn
          - bs
          - ca
          - cs
          - cy
          - da
          - de
          - el
          - en
          - es
          - fa
          - fi
          - fr
          - ga
          - gd
          - gl
          - gu
          - he
          - hi
          - hr
          - hu
          - id
          - it
          - ja
          - kn
          - ko
          - lv
          - mk
          - ml
          - mn
          - ms
          - my
          - nl
          - "no"
          - pl
          - pt
          - ro
          - ru
          - si
          - sr
          - su
          - sv
          - te
          - th
          - tr
          - ur
          - uz
          - vi
          - zh

# Read-only by default; the two jobs that cut a release opt up to
# `contents: write` themselves (CORE-1920). This was `contents: write` +
# `issues: write` + `pull-requests: write` for the whole workflow, which
# handed the detect job — a checkout and two shell steps — a token that
# could push tags, cut releases, and write issues and pull requests.
# Nothing here has ever used the issues or pull-requests scopes.
permissions:
  contents: read

jobs:
  detect-changed-packs:
    name: Detect Changed Language Packs
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    outputs:
      packs: ${{ steps.detect.outputs.packs }}
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 2

      - name: Load language list from source of truth
        id: langs
        run: |
          VALID_LANGS=$(python3 -c "import json; print('|'.join(sorted(json.load(open('libs/i18n/legesher_i18n/languages.json'))['languages'].keys())))")
          echo "regex=$VALID_LANGS" >> $GITHUB_OUTPUT
          echo "Valid languages: $VALID_LANGS"

      - name: Detect changed language packs
        id: detect
        run: |
          # Get changed files
          CHANGED_FILES=$(git diff --name-only HEAD~1 HEAD)

          # Find changed language pack directories (validated against source of truth)
          PACKS=$(echo "$CHANGED_FILES" | { grep -E "^libs/i18n/language-packs/python/(${{ steps.langs.outputs.regex }})/" || true; } | cut -d/ -f5 | sort -u | jq -R -s -c 'split("\n") | map(select(length > 0))')

          echo "Changed packs: $PACKS"
          echo "packs=$PACKS" >> $GITHUB_OUTPUT

  release-pack:
    name: Release i18n-python-${{ matrix.pack }}
    runs-on: ubuntu-latest
    needs: [detect-changed-packs]
    if: needs.detect-changed-packs.outputs.packs != '[]'
    permissions:
      contents: write  # tags, and the GitHub release body
    strategy:
      matrix:
        pack: ${{ fromJson(needs.detect-changed-packs.outputs.packs) }}

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          version: "latest"
          enable-cache: true

      - name: Install dependencies
        run: |
          uv pip install --system python-semantic-release

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Release language pack
        id: version
        working-directory: libs/i18n/language-packs/python/${{ matrix.pack }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Bound here rather than interpolated into the script below, so the
          # value arrives as data instead of as shell source (CORE-1920).
          PACK: ${{ matrix.pack }}
        run: |
          echo "📦 Releasing i18n-python-$PACK..."
          if python -m semantic_release version --verbose; then
            echo "released=true" >> $GITHUB_OUTPUT
          else
            echo "ℹ️ No release needed for i18n-python-$PACK"
            echo "released=false" >> $GITHUB_OUTPUT
          fi

      - name: Create GitHub Release
        if: steps.version.outputs.released == 'true'
        working-directory: libs/i18n/language-packs/python/${{ matrix.pack }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python -m semantic_release publish --verbose

      # `uv build <path>` — positional, and WITH build isolation.
      # Two bugs lived on this line (CORE-1920 review). `-p` is uv's short
      # form of `--python`, not `--package`, so the pack path was handed to
      # interpreter discovery and the build failed every time — after
      # `semantic_release version` had already pushed the tag and cut the
      # GitHub Release, so a release could ship with no dists and a red job.
      # And `--no-build-isolation` cannot work here regardless: the packs
      # build with `pdm-backend`, which this job never installs. Matches the
      # form `publish-pypi.yml` already uses.
      - name: Build package
        if: steps.version.outputs.released == 'true'
        env:
          PACK: ${{ matrix.pack }}
        run: |
          uv build "libs/i18n/language-packs/python/$PACK"

      - name: Upload build artifacts
        if: steps.version.outputs.released == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: i18n-python-${{ matrix.pack }}-dist-${{ github.sha }}
          path: libs/i18n/language-packs/python/${{ matrix.pack }}/dist/
          retention-days: 90

  release-manual:
    name: Manual Release ${{ github.event.inputs.target }}-${{ github.event.inputs.language }}
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    permissions:
      contents: write  # tags, and the GitHub release body

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          version: "latest"
          enable-cache: true

      - name: Install dependencies
        run: |
          uv pip install --system python-semantic-release

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Release language pack
        id: version
        working-directory: libs/i18n/language-packs/${{ github.event.inputs.target }}/${{ github.event.inputs.language }}
        # Dispatch inputs reach the script as variables, never as `${{ }}`
        # substituted into it — substitution happens before bash parses, so
        # an interpolated input is shell source rather than data (CORE-1920).
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET: ${{ github.event.inputs.target }}
          LANGUAGE: ${{ github.event.inputs.language }}
        run: |
          echo "📦 Releasing i18n-$TARGET-$LANGUAGE..."
          if python -m semantic_release version --verbose; then
            echo "released=true" >> "$GITHUB_OUTPUT"
          else
            echo "ℹ️ No release needed"
            echo "released=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        if: steps.version.outputs.released == 'true'
        working-directory: libs/i18n/language-packs/${{ github.event.inputs.target }}/${{ github.event.inputs.language }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python -m semantic_release publish --verbose

      # `uv build <path>` — positional, and WITH build isolation.
      # Two bugs lived on this line (CORE-1920 review). `-p` is uv's short
      # form of `--python`, not `--package`, so the pack path was handed to
      # interpreter discovery and the build failed every time — after
      # `semantic_release version` had already pushed the tag and cut the
      # GitHub Release, so a release could ship with no dists and a red job.
      # And `--no-build-isolation` cannot work here regardless: the packs
      # build with `pdm-backend`, which this job never installs. Matches the
      # form `publish-pypi.yml` already uses.
      - name: Build package
        if: steps.version.outputs.released == 'true'
        env:
          TARGET: ${{ github.event.inputs.target }}
          LANGUAGE: ${{ github.event.inputs.language }}
        run: |
          uv build "libs/i18n/language-packs/$TARGET/$LANGUAGE"

      - name: Upload build artifacts
        if: steps.version.outputs.released == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: i18n-${{ github.event.inputs.target }}-${{ github.event.inputs.language }}-dist-${{ github.sha }}
          path: libs/i18n/language-packs/${{ github.event.inputs.target }}/${{ github.event.inputs.language }}/dist/
          retention-days: 90

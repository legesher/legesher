name: Release Language Packs

on:
  push:
    branches:
      - main
    paths:
      - 'libs/i18n-python-**/**'
  workflow_dispatch:
    inputs:
      target:
        description: 'Target language (e.g., python)'
        required: true
        default: 'python'
        type: string
      language:
        description: 'Language code (e.g., es, ar)'
        required: true
        type: choice
        options:
          - es
          - ar

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  detect-changed-packs:
    name: Detect Changed Language Packs
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    outputs:
      packs: ${{ steps.detect.outputs.packs }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect changed language packs
        id: detect
        run: |
          # Get changed files
          CHANGED_FILES=$(git diff --name-only HEAD~1 HEAD)

          # Find changed language pack directories
          PACKS=$(echo "$CHANGED_FILES" | grep -E '^libs/i18n-python-(es|ar)/' | cut -d/ -f2 | sort -u | jq -R -s -c 'split("\n") | map(select(length > 0))')

          echo "Changed packs: $PACKS"
          echo "packs=$PACKS" >> $GITHUB_OUTPUT

  release-pack:
    name: Release ${{ matrix.pack }}
    runs-on: ubuntu-latest
    needs: detect-changed-packs
    if: needs.detect-changed-packs.outputs.packs != '[]'
    strategy:
      matrix:
        pack: ${{ fromJson(needs.detect-changed-packs.outputs.packs) }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Install dependencies
        run: |
          uv pip install --system python-semantic-release

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Release language pack
        working-directory: libs/${{ matrix.pack }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "📦 Releasing ${{ matrix.pack }}..."
          if ! uv run semantic-release version --verbose; then
            echo "ℹ️ No release needed for ${{ matrix.pack }}"
            exit 0
          fi

      - name: Create GitHub Release
        if: success()
        working-directory: libs/${{ matrix.pack }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          uv run semantic-release publish --verbose

      - name: Build package
        if: success()
        run: |
          uv build -p libs/${{ matrix.pack }}

      - name: Upload build artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.pack }}-dist-${{ github.sha }}
          path: libs/${{ matrix.pack }}/dist/
          retention-days: 90

  release-manual:
    name: Manual Release ${{ github.event.inputs.target }}-${{ github.event.inputs.language }}
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Install dependencies
        run: |
          uv pip install --system python-semantic-release

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Release language pack
        working-directory: libs/i18n-${{ github.event.inputs.target }}-${{ github.event.inputs.language }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "📦 Releasing i18n-${{ github.event.inputs.target }}-${{ github.event.inputs.language }}..."
          if ! uv run semantic-release version --verbose; then
            echo "ℹ️ No release needed"
            exit 0
          fi

      - name: Create GitHub Release
        if: success()
        working-directory: libs/i18n-${{ github.event.inputs.target }}-${{ github.event.inputs.language }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          uv run semantic-release publish --verbose

      - name: Build package
        if: success()
        run: |
          uv build -p libs/i18n-${{ github.event.inputs.target }}-${{ github.event.inputs.language }}

      - name: Upload build artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: i18n-${{ github.event.inputs.target }}-${{ github.event.inputs.language }}-dist-${{ github.sha }}
          path: libs/i18n-${{ github.event.inputs.target }}-${{ github.event.inputs.language }}/dist/
          retention-days: 90

name: Release Language Packs

on:
  push:
    branches:
      - main
    paths:
      - 'libs/i18n/language-packs/python/**'
  workflow_dispatch:
    inputs:
      target:
        description: 'Target language (e.g., python)'
        required: true
        default: 'python'
        type: string
      language:
        description: 'Language code (e.g., es, ar)'
        required: true
        type: choice
        # Options must match libs/i18n/legesher_i18n/languages.json (source of truth)
        options:
          - ar
          - da
          - de
          - el
          - en
          - es
          - fi
          - fr
          - he
          - hi
          - hu
          - id
          - it
          - ja
          - ko
          - ms
          - nl
          - "no"
          - pl
          - pt
          - ru
          - sv
          - th
          - tr
          - vi
          - zh

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  lint:
    name: Lint & Validate
    runs-on: ubuntu-latest
    if: "github.event_name != 'push' || (!contains(github.event.head_commit.message, 'chore(release)') && !contains(github.event.head_commit.message, 'chore: update uv.lock'))"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      - name: Run pre-commit
        uses: pre-commit/action@v3.0.1

  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    if: "github.event_name != 'push' || (!contains(github.event.head_commit.message, 'chore(release)') && !contains(github.event.head_commit.message, 'chore: update uv.lock'))"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.10', '3.13']
        exclude:
          # Only test 3.13 on macOS/Windows to save credits
          - os: macos-latest
            python-version: '3.10'
          - os: windows-latest
            python-version: '3.10'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      - name: Run i18n tests
        run: uv run pytest libs/i18n/tests/ -v

  detect-changed-packs:
    name: Detect Changed Language Packs
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    outputs:
      packs: ${{ steps.detect.outputs.packs }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Load language list from source of truth
        id: langs
        run: |
          VALID_LANGS=$(python3 -c "import json; print('|'.join(sorted(json.load(open('libs/i18n/legesher_i18n/languages.json'))['languages'].keys())))")
          echo "regex=$VALID_LANGS" >> $GITHUB_OUTPUT
          echo "Valid languages: $VALID_LANGS"

      - name: Detect changed language packs
        id: detect
        run: |
          # Get changed files
          CHANGED_FILES=$(git diff --name-only HEAD~1 HEAD)

          # Find changed language pack directories (validated against source of truth)
          PACKS=$(echo "$CHANGED_FILES" | { grep -E "^libs/i18n/language-packs/python/(${{ steps.langs.outputs.regex }})/" || true; } | cut -d/ -f5 | sort -u | jq -R -s -c 'split("\n") | map(select(length > 0))')

          echo "Changed packs: $PACKS"
          echo "packs=$PACKS" >> $GITHUB_OUTPUT

  release-pack:
    name: Release i18n-python-${{ matrix.pack }}
    runs-on: ubuntu-latest
    needs: [lint, test, detect-changed-packs]
    if: needs.detect-changed-packs.outputs.packs != '[]'
    strategy:
      matrix:
        pack: ${{ fromJson(needs.detect-changed-packs.outputs.packs) }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Install dependencies
        run: |
          uv pip install --system python-semantic-release

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Release language pack
        working-directory: libs/i18n/language-packs/python/${{ matrix.pack }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "📦 Releasing i18n-python-${{ matrix.pack }}..."
          if ! uv run semantic-release version --verbose; then
            echo "ℹ️ No release needed for i18n-python-${{ matrix.pack }}"
            exit 0
          fi

      - name: Create GitHub Release
        if: success()
        working-directory: libs/i18n/language-packs/python/${{ matrix.pack }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          uv run semantic-release publish --verbose

      - name: Build package
        if: success()
        run: |
          uv build -p libs/i18n/language-packs/python/${{ matrix.pack }}

      - name: Upload build artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: i18n-python-${{ matrix.pack }}-dist-${{ github.sha }}
          path: libs/i18n/language-packs/python/${{ matrix.pack }}/dist/
          retention-days: 90

  release-manual:
    name: Manual Release ${{ github.event.inputs.target }}-${{ github.event.inputs.language }}
    runs-on: ubuntu-latest
    needs: [lint, test]
    if: github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Install dependencies
        run: |
          uv pip install --system python-semantic-release

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Release language pack
        working-directory: libs/i18n/language-packs/${{ github.event.inputs.target }}/${{ github.event.inputs.language }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "📦 Releasing i18n-${{ github.event.inputs.target }}-${{ github.event.inputs.language }}..."
          if ! uv run semantic-release version --verbose; then
            echo "ℹ️ No release needed"
            exit 0
          fi

      - name: Create GitHub Release
        if: success()
        working-directory: libs/i18n/language-packs/${{ github.event.inputs.target }}/${{ github.event.inputs.language }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          uv run semantic-release publish --verbose

      - name: Build package
        if: success()
        run: |
          uv build -p libs/i18n/language-packs/${{ github.event.inputs.target }}/${{ github.event.inputs.language }}

      - name: Upload build artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: i18n-${{ github.event.inputs.target }}-${{ github.event.inputs.language }}-dist-${{ github.sha }}
          path: libs/i18n/language-packs/${{ github.event.inputs.target }}/${{ github.event.inputs.language }}/dist/
          retention-days: 90

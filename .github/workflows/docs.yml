name: Docs
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled]
    paths: ['docs/**', 'libs/i18n/language-packs/**']
  push:
    branches: [main]
    paths: ['docs/**', 'libs/i18n/language-packs/**']

# Declared rather than inherited (CORE-1920). With no block this job took the
# repository default token on push-to-main, then ran `pip install -r`,
# `pnpm install` and `playwright install` — three package managers executing
# third-party lifecycle scripts. It only ever reads the checkout.
permissions:
  contents: read

jobs:
  docs:
    # Draft PRs skip this; marking the PR ready fires `ready_for_review` and
    # runs it against the final commit. `ci:run` forces a run while in draft.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.draft == false ||
      contains(github.event.pull_request.labels.*.name, 'ci:run')
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: docs } }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      # 3.13, not 3.12: pack validation bottoms out in `str.isidentifier()`,
      # which is Unicode-version dependent. `ja` `divmod` is
      # `ディビジョン・モジュール`, and U+30FB (katakana middle dot) only became
      # identifier-valid in the Unicode tables Python 3.13 ships — 3.12 returns
      # False and rejects a pack that is correct. Same for the 17 `si` ZWJ
      # selections. 3.13 is already the de-facto floor for pack validation and
      # export work; this job was the last one below it (CORE-1899).
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: '3.13' }
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with: { version: 10 }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22, cache: pnpm, cache-dependency-path: docs/pnpm-lock.yaml }
      - run: pip install -r scripts/requirements.txt
      - run: python -m pytest scripts/tests -v
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e

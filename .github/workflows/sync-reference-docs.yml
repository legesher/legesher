name: Sync Reference Docs to Preview

on:
  push:
    branches:
      - main
    paths:
      - 'libs/i18n/language-packs/python/*/REFERENCE.md'
  workflow_dispatch:
    inputs:
      force:
        description: 'Force sync all REFERENCE.md files'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  sync-to-preview:
    name: Sync Reference Documentation
    runs-on: ubuntu-latest
    # The target repository (owner/name) comes from the `PREVIEW_REPOSITORY`
    # secret, not a variable, so the runner masks it in the public logs.
    # A job-level `if:` cannot read secrets, so each step checks it instead
    # and the job does nothing when it is unset.
    env:
      PREVIEW_REPOSITORY: ${{ secrets.PREVIEW_REPOSITORY }}

    steps:
      - name: Checkout monorepo
        if: ${{ env.PREVIEW_REPOSITORY != '' }}
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Checkout preview repository
        if: ${{ env.PREVIEW_REPOSITORY != '' }}
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: ${{ env.PREVIEW_REPOSITORY }}
          token: ${{ secrets.PREVIEW_REPO_PAT }}
          path: preview

      - name: Sync REFERENCE.md files
        if: ${{ env.PREVIEW_REPOSITORY != '' }}
        # Bound through `env:` rather than interpolated into the script —
        # `${{ }}` substitutes before bash parses, making the value shell
        # source (CORE-1920). `force` is a boolean input, so the reachable
        # values are narrow, but the fix costs nothing and the next input
        # added here will not be.
        env:
          FORCE: ${{ github.event.inputs.force || 'false' }}
        run: |
          echo "📚 Syncing REFERENCE.md files to the preview repository..."

          # Sync all language pack REFERENCE.md files
          for lang_dir in libs/i18n/language-packs/python/*/; do
            lang_code=$(basename "$lang_dir")

            # Skip if no REFERENCE.md exists
            if [ ! -f "$lang_dir/REFERENCE.md" ]; then
              echo "⏭️  Skipping $lang_code (no REFERENCE.md)"
              continue
            fi

            # Create target directory if needed
            mkdir -p "preview/languages/$lang_code"

            # Skip unchanged files unless force is true
            if [ "$FORCE" != "true" ] && [ -f "preview/languages/$lang_code/REFERENCE.md" ]; then
              if diff -q "$lang_dir/REFERENCE.md" "preview/languages/$lang_code/REFERENCE.md" > /dev/null 2>&1; then
                echo "⏭️  Skipping $lang_code (unchanged)"
                continue
              fi
            fi

            # Copy REFERENCE.md
            cp "$lang_dir/REFERENCE.md" "preview/languages/$lang_code/"
            echo "✅ Synced $lang_code/REFERENCE.md"
          done

      - name: Commit and push to preview
        if: ${{ env.PREVIEW_REPOSITORY != '' }}
        working-directory: preview
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add -A

          # Check if there are changes to commit
          if git diff --staged --quiet; then
            echo "ℹ️  No changes to sync"
            exit 0
          fi

          # Get list of changed files for commit message
          CHANGED=$(git diff --staged --name-only | wc -l | tr -d ' ')

          git commit -m "chore: sync REFERENCE.md from monorepo

          Synced $CHANGED language reference file(s) from legesher monorepo.

          Source: ${{ github.repository }}@${{ github.sha }}"

          git push

          echo "🚀 Pushed $CHANGED file(s) to the preview repository"

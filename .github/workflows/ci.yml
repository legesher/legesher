name: CI

on:
  pull_request:
    branches:
      - main
    # `ready_for_review` and `labeled` are NOT in the default type set
    # ([opened, synchronize, reopened]); without them the draft gate below
    # can never open — the flip out of draft would fire no event at all.
    types: [opened, synchronize, reopened, ready_for_review, labeled]
  push:
    branches:
      - main
    # No `paths:` filter. Push-to-main is a main-state safety net, not a
    # "test the diff" job — we want the full matrix to run on every merge
    # so we catch drift from OS image updates, Python patch releases, and
    # dependency surface changes across time, regardless of what the
    # triggering merge touched. Semantic-release auto-commits are still
    # skipped via the job-level `if:` conditions below.
  workflow_dispatch:

# Cancel stale runs on the same PR branch when new commits arrive; never
# cancel runs on main (protects release safety — a cancelled main run could
# leave the release workflow in an ambiguous state).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  lint:
    name: Lint & Validate
    runs-on: ubuntu-latest
    # Skip-gate: semantic-release auto-commits on main should not retrigger
    # the suite. Uses `startsWith` (not `contains`) because squash-merged PR
    # commit messages embed the full PR body — if the body happens to mention
    # any of these strings (e.g., this very comment!), `contains` would match
    # inside the body and the whole workflow would skip itself. `startsWith`
    # only matches the conventional-commit prefix at the start of the subject
    # line, which is where semantic-release actually puts it:
    #   * "chore(release): X.Y.Z"
    #   * "chore: update uv.lock after version bump"
    #   * "docs(changelog): stamp release [CORE-608]"
    # Regression shipped in PR #208 (the CORE-1122 merge commit) — its
    # squash-body mentioned all three prefixes in a bullet list, tripping
    # the skip-gate on the very commit that introduced this workflow.
    # Two independent gates:
    #  1. push-to-main: skip semantic-release's own auto-commits.
    #  2. pull_request: skip while the PR is a draft (see /pr draft-first).
    #     Draft PRs cost zero Actions minutes; marking the PR ready fires
    #     `ready_for_review` and runs this against the final commit. The
    #     `ci:run` label forces a run without leaving draft.
    if: >-
      (github.event_name != 'push' ||
       (!startsWith(github.event.head_commit.message, 'chore(release)') &&
        !startsWith(github.event.head_commit.message, 'chore: update uv.lock') &&
        !startsWith(github.event.head_commit.message, 'docs(changelog): stamp'))) &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.draft == false ||
       contains(github.event.pull_request.labels.*.name, 'ci:run'))

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          version: "latest"
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      # `pre-commit/action@v3.0.1` inlined (CORE-1924). We pinned our own
      # reference to it, but its `action.yml` calls `actions/cache@v4` — an
      # unpinned ref inside someone else's action, which nothing on our side
      # can pin. The org policy resolves transitively and rejects it at job
      # dispatch, so `Lint & Validate` died at `Set up job` on every run from
      # the moment SHA pinning was re-enabled:
      #
      #   The action actions/cache@v4 is not allowed in this repository
      #   because all actions must be pinned to a full-length commit SHA.
      #
      # The action is four steps and two of them (install pre-commit, freeze)
      # are redundant here — `uv sync` above already installs the pinned
      # `pre-commit>=4.6.0` from the workspace. Inlining costs less than
      # vendoring a fork, drops a supply-chain hop from the job that runs
      # every hook, and runs the version the lockfile chose rather than
      # whatever `pip install pre-commit` resolves to.
      - name: Cache pre-commit environments
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-3|${{ env.pythonLocation }}|${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Run pre-commit
        run: uv run pre-commit run --show-diff-on-failure --color=always --all-files

      # scripts/tests holds the action-graph auditor's tests and the
      # repo-hygiene guard (CORE-2214). workflow-lint.yml runs the directory
      # only when a workflow file changes; the guard has to run on every PR.
      - name: Test the repo scripts
        run: uv run pytest scripts/tests -q

  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    # Same skip-gate as the `lint` job above — see its comment for why this
    # uses `startsWith` instead of `contains`.
    # Two independent gates:
    #  1. push-to-main: skip semantic-release's own auto-commits.
    #  2. pull_request: skip while the PR is a draft (see /pr draft-first).
    #     Draft PRs cost zero Actions minutes; marking the PR ready fires
    #     `ready_for_review` and runs this against the final commit. The
    #     `ci:run` label forces a run without leaving draft.
    if: >-
      (github.event_name != 'push' ||
       (!startsWith(github.event.head_commit.message, 'chore(release)') &&
        !startsWith(github.event.head_commit.message, 'chore: update uv.lock') &&
        !startsWith(github.event.head_commit.message, 'docs(changelog): stamp'))) &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.draft == false ||
       contains(github.event.pull_request.labels.*.name, 'ci:run'))
    strategy:
      fail-fast: false
      matrix:
        # Tiered matrix:
        # - PR: ubuntu only (both Python versions) — fast contributor feedback
        # - push/workflow_dispatch: full matrix — pre-merge safety net
        os: ${{ github.event_name == 'pull_request' && fromJSON('["ubuntu-latest"]') || fromJSON('["ubuntu-latest", "macos-latest", "windows-latest"]') }}
        python-version: ['3.10', '3.13']
        exclude:
          # Only test 3.13 on macOS/Windows to save credits
          - os: macos-latest
            python-version: '3.10'
          - os: windows-latest
            python-version: '3.10'

    # uv follows the repository's .python-version (3.13) over the interpreter
    # setup-python puts on PATH, so without this the 3.10 leg built its
    # environment with 3.13 and tested nothing on 3.10 (CORE-2334). The
    # "Install dependencies" step checks the result.
    env:
      UV_PYTHON: ${{ matrix.python-version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          version: "latest"
          enable-cache: true

      # The interpreter check is part of this step so that a mismatch fails
      # `deps`, and every suite below, gated on it, skips rather than testing
      # the wrong interpreter under the matrix's name.
      - name: Install dependencies
        id: deps
        shell: bash
        env:
          WANT: ${{ matrix.python-version }}
        run: |
          uv sync
          uv run python - <<'EOF'
          import os
          import sys

          got = "%d.%d" % sys.version_info[:2]
          if got != os.environ["WANT"]:
              sys.exit(f"the matrix asks for Python {os.environ['WANT']}, the environment runs {got}")
          print(f"the environment runs Python {got}, as the matrix asks")
          EOF

      # Every suite below runs even when an earlier SUITE fails (CORE-1921).
      # GitHub stops a job at the first failing step, so a red `libs/core`
      # used to mark the other five `skipped` and report a single failure —
      # which looked like "core is broken" but actually meant "we have no
      # idea about the other five". On `windows-latest` that hid i18n, the
      # collision audit, legesher, language-server and MCP for the entire
      # life of the Windows job: it had never once reached them.
      #
      # `!cancelled()` rather than `always()` — `always()` also keeps going
      # after someone manually cancels a run, which burns minutes on a run
      # nobody wants any more. The job still fails if any step fails; the
      # difference is that the summary names all of them.
      #
      # Gated on `steps.deps.outcome` as well, so this only widens reporting
      # for *test* failures. A broken environment is not six broken packages:
      # when `uv sync` fails (run 31832469690, windows leg, 1s) every suite
      # would otherwise run `uv run` against it, fail identically, and each
      # re-attempt the sync — six red steps naming five innocent packages,
      # on the slowest runner. That inverts the point of the change.
      #
      # NOTE: this depends on `fail-fast: false` above. Under `fail-fast:
      # true` a sibling leg's failure cancels this one, `cancelled()` flips
      # true, and every gated step would skip — losing exactly the
      # visibility this buys.
      - name: Run core tests
        run: uv run pytest libs/core/tests/ -v --cov=legesher_core --cov-report=xml:coverage-core.xml

      - name: Run i18n tests
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: uv run pytest libs/i18n/tests/ -v --cov=legesher_i18n --cov-report=xml:coverage-i18n.xml

      # CORE-950 collision guardrail. Pre-commit's
      # validate-language-pack-yaml hook (configured at
      # .pre-commit-config.yaml) catches cross-section collisions on
      # CHANGED pack YAMLs at commit time. This CI step is the
      # second layer: scans the WHOLE monorepo every PR so a collision
      # introduced via a non-pack-edit path (e.g., DB import script
      # change, schema migration) doesn't slip through. The audit
      # logic lives in a Python script (not inline) so it stays
      # shell-agnostic across the Linux/macOS/Windows test matrix and
      # avoids YAML-block-scalar indentation pitfalls (Copilot review
      # on PR #237).
      - name: i18n collision audit (DB + all packs)
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: uv run python libs/i18n/scripts/audit_collisions.py

      - name: Run legesher tests
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: uv run pytest libs/legesher/tests/ -v --cov=legesher --cov-report=xml:coverage-legesher.xml

      - name: Run language-server tests
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: uv run pytest libs/language-server/tests/ -v --cov=legesher_language_server --cov-report=xml:coverage-ls.xml

      # Per-commit tier only. The `scheduled` suites (all-packs round-trip
      # sweep, clean-environment wheel spawn) are deselected by libs/mcp's
      # own addopts and gate the release instead — see release-mcp.yml.
      - name: Run MCP server tests
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: uv run pytest libs/mcp/tests/ -v --cov=legesher_mcp --cov-report=xml:coverage-mcp.xml

      # Never ran here before CORE-2129: `make test` had a test-runtime
      # target, this workflow did not. The suite builds its own message
      # catalog (libs/runtime/tests/conftest.py), so it does not depend on
      # the gitignored translations database a runner never has.
      - name: Run runtime tests
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: uv run pytest libs/runtime/tests/ -v --cov=legesher_runtime --cov-report=xml:coverage-runtime.xml

      # Deliberately NOT given `!cancelled()` (CORE-1921). Every suite above
      # now runs regardless, so all six XMLs exist even on a red job — but
      # coverage from a run whose assertions failed is lines executed, not
      # behaviour verified, and publishing it as the project number would
      # overstate what is actually covered. Fix the build, then measure.
      - name: Upload coverage reports to Codecov
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.13'
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v6
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage-core.xml,coverage-i18n.xml,coverage-legesher.xml,coverage-ls.xml,coverage-mcp.xml,coverage-runtime.xml
          fail_ci_if_error: false

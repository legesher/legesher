name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    # No `paths:` filter. Push-to-main is a main-state safety net, not a
    # "test the diff" job — we want the full matrix to run on every merge
    # so we catch drift from OS image updates, Python patch releases, and
    # dependency surface changes across time, regardless of what the
    # triggering merge touched. Semantic-release auto-commits are still
    # skipped via the job-level `if:` conditions below.
  workflow_dispatch:

# Cancel stale runs on the same PR branch when new commits arrive; never
# cancel runs on main (protects release safety — a cancelled main run could
# leave the release workflow in an ambiguous state).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  lint:
    name: Lint & Validate
    runs-on: ubuntu-latest
    # Skip-gate preserved from release-foundation.yml: auto-release commits
    # on main (chore(release), chore: update uv.lock, docs(changelog): stamp)
    # should not retrigger the suite. Only fires on push; irrelevant on PRs.
    if: "github.event_name != 'push' || (!contains(github.event.head_commit.message, 'chore(release)') && !contains(github.event.head_commit.message, 'chore: update uv.lock') && !contains(github.event.head_commit.message, 'docs(changelog): stamp'))"

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      - name: Run pre-commit
        uses: pre-commit/action@v3.0.1

      - name: Check license boundary (import-linter)
        run: uv run lint-imports

  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    if: "github.event_name != 'push' || (!contains(github.event.head_commit.message, 'chore(release)') && !contains(github.event.head_commit.message, 'chore: update uv.lock') && !contains(github.event.head_commit.message, 'docs(changelog): stamp'))"
    strategy:
      fail-fast: false
      matrix:
        # Tiered matrix:
        # - PR: ubuntu only (both Python versions) — fast contributor feedback
        # - push/workflow_dispatch: full matrix — pre-merge safety net
        os: ${{ github.event_name == 'pull_request' && fromJSON('["ubuntu-latest"]') || fromJSON('["ubuntu-latest", "macos-latest", "windows-latest"]') }}
        python-version: ['3.10', '3.13']
        exclude:
          # Only test 3.13 on macOS/Windows to save credits
          - os: macos-latest
            python-version: '3.10'
          - os: windows-latest
            python-version: '3.10'

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      - name: Run core tests
        run: uv run pytest libs/core/tests/ -v

      - name: Run i18n tests
        run: uv run pytest libs/i18n/tests/ -v

      - name: Run legesher tests
        run: uv run pytest libs/legesher/tests/ -v

      - name: Run language-server tests
        run: uv run pytest libs/language-server/tests/ -v

name: License Question
description: Ask a question about licensing, redistribution, or the hosted service
title: '[License]: '
labels: [question, licensing]
body:
- type: markdown
  attributes:
    value: |
      Have a question about Legesher's licensing? We're here to help.

      ## Quick Reference
      **Everything in this repository is Apache License 2.0** — the `legesher` CLI, core, i18n,
      language-server, mcp, and vs-code. You may use, modify, and redistribute it, including
      commercially, subject to the license terms. There is no paid tier for anything here, and
      no contributor licence agreement to sign.

      Legesher is open-core: the paid capabilities are the separate, closed-source **hosted
      service**, where access is gated by account and API key rather than by a license on this
      code. Nothing in this repository needs an account or a network call to work.

      "Legesher" and its logos are trademarks — see [LICENSING.md](https://github.com/legesher/legesher/blob/main/LICENSING.md).

      See [LICENSE](https://github.com/legesher/legesher/blob/main/LICENSE) for the full Apache 2.0 terms.

- type: dropdown
  id: question-type
  attributes:
    label: What type of licensing question do you have?
    options:
    - Can I use this in a commercial product?
    - Can I redistribute, repackage, or resell this software?
    - Can I use the "Legesher" name or logo?
    - What is covered by the hosted service vs. this repository?
    - Attribution / NOTICE requirements
    - Language pack and translation-data licensing
    - Other
  validations:
    required: true

- type: dropdown
  id: package
  attributes:
    label: Which package(s) is your question about?
    multiple: true
    options:
    - legesher (CLI)
    - legesher-core
    - legesher-i18n
    - legesher-language-server
    - legesher-mcp
    - legesher-vs-code
    - Python language packs
    - The hosted service
    - Not sure / General question
  validations:
    required: true

- type: dropdown
  id: use-case
  attributes:
    label: What is your intended use case?
    options:
    - Personal/hobby project
    - Open source project
    - Commercial product (for-profit)
    - Internal business tool
    - Educational/research
    - Government/non-profit
    - Redistribution / packaging
    - Other
  validations:
    required: true

- type: textarea
  id: question
  attributes:
    label: Your Question
    description: Please describe your licensing question in detail
    placeholder: |
      I would like to know if I can...
      My company wants to...
      I'm confused about...
  validations:
    required: true

- type: textarea
  id: context
  attributes:
    label: Additional Context
    description: Any additional information that might help us answer your question

- type: checkboxes
  id: documentation-reviewed
  attributes:
    label: Have you reviewed the licensing documentation?
    options:
    - label: I have read [LICENSING.md](https://github.com/legesher/legesher/blob/main/LICENSING.md)
    - label: I have read the [LICENSE](https://github.com/legesher/legesher/blob/main/LICENSE) file

- type: markdown
  attributes:
    value: |
      ---

      ## Contact
      - [legal@legesher.com](mailto:legal@legesher.com): licensing and trademark questions
      - [hello@legesher.com](mailto:hello@legesher.com): the hosted service, plans, and enterprise use

- type: checkboxes
  id: terms
  attributes:
    label: Code of Conduct
    description: By submitting this issue, you agree to follow our Code of Conduct
    options:
    - label: I agree to follow this project's Code of Conduct
      required: true

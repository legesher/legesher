name: License Question
description: Ask a question about licensing or commercial use
title: '[License]: '
labels: [question, licensing]
body:
- type: markdown
  attributes:
    value: |
      Have a question about Legesher's licensing model? We're here to help!

      ## Quick Reference
      - **Open Source (Apache 2.0)**: core, i18n, vs-code - free for any use
      - **Dual License**: legesher - free tier (Apache 2.0) or premium (Commercial)

      See [LICENSE](../../LICENSE) for full details.

- type: dropdown
  id: question-type
  attributes:
    label: What type of licensing question do you have?
    options:
    - Can I use this for commercial projects?
    - What features are included in the free tier?
    - How do I purchase a commercial license?
    - What's the difference between Apache 2.0 and dual-license?
    - Can I redistribute/resell this software?
    - Enterprise licensing inquiry
    - OEM/embedded licensing inquiry
    - Other
  validations:
    required: true

- type: dropdown
  id: package
  attributes:
    label: Which package(s) is your question about?
    multiple: true
    options:
    - legesher-core (Apache 2.0)
    - legesher-i18n (Apache 2.0)
    - legesher-vs-code (Apache 2.0)
    - legesher (Dual License)
    - Not sure / General question
  validations:
    required: true

- type: dropdown
  id: use-case
  attributes:
    label: What is your intended use case?
    options:
    - Personal/hobby project
    - Open source project
    - Commercial product (for-profit)
    - Internal business tool
    - Educational/research
    - Government/non-profit
    - Resale/redistribution
    - OEM/embedded use
    - Other
  validations:
    required: true

- type: textarea
  id: question
  attributes:
    label: Your Question
    description: Please describe your licensing question in detail
    placeholder: |
      I would like to know if I can...
      My company wants to...
      I'm confused about...
  validations:
    required: true

- type: textarea
  id: context
  attributes:
    label: Additional Context
    description: Any additional information that might help us answer your question
    placeholder: |
      - Company size/type (if applicable)
      - Expected scale of use
      - Geographic location
      - Timeline

- type: checkboxes
  id: documentation-reviewed
  attributes:
    label: Have you reviewed the licensing documentation?
    options:
    - label: I have read the [LICENSE](../../LICENSE) file
    - label: I have read the [CONTRIBUTING.md](../../CONTRIBUTING.md) file

- type: markdown
  attributes:
    value: |
      ---

      ## Response Time
      - General questions: We aim to respond within 2-3 business days
      - Enterprise inquiries: Priority response within 1 business day

      ## Contact Information
      For urgent commercial licensing inquiries, you can also reach us at:
      - Email: sales@legesher.com (commercial licenses)
      - Email: legal@legesher.com (legal questions)

- type: checkboxes
  id: terms
  attributes:
    label: Code of Conduct
    description: By submitting this issue, you agree to follow our Code of Conduct
    options:
    - label: I agree to follow this project's Code of Conduct
      required: true

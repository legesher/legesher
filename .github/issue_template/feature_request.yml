name: Feature Request
description: Suggest an idea or enhancement for this project
title: '[Feature]: '
labels: [enhancement, triage]
body:
- type: markdown
  attributes:
    value: |
      Thanks for suggesting a feature! Please fill out the form below.

- type: dropdown
  id: package
  attributes:
    label: Which package should this feature be added to?
    description: Select the package this feature request is for
    options:
    - legesher-core (Core translation engine)
    - legesher-i18n (Language data)
    - legesher-vs-code (VS Code extension)
    - legesher (Main CLI/library)
    - Documentation
    - Not sure
  validations:
    required: true

- type: checkboxes
  id: contribution-type
  attributes:
    label: License Awareness
    description: |
      Please note which packages accept community contributions:
      - ✅ Open Source (MIT): core, i18n, vs-code (contributions welcome!)
      - ⚠️ Dual License: legesher (free tier contributions welcome)
      - ❌ Proprietary: home (no external contributions)
    options:
    - label: I understand the licensing structure and contribution policy
      required: true

- type: textarea
  id: problem
  attributes:
    label: Problem Statement
    description: Is your feature request related to a problem? Please describe.
    placeholder: I'm always frustrated when...
  validations:
    required: true

- type: textarea
  id: solution
  attributes:
    label: Proposed Solution
    description: Describe the solution you'd like
    placeholder: I'd like to see...
  validations:
    required: true

- type: textarea
  id: alternatives
  attributes:
    label: Alternatives Considered
    description: Describe any alternative solutions or features you've considered
    placeholder: I also considered...

- type: dropdown
  id: language
  attributes:
    label: Is this related to a specific programming language?
    options:
    - Python
    - JavaScript/TypeScript
    - Multiple languages
    - Language-agnostic
    - Other

- type: textarea
  id: use-case
  attributes:
    label: Use Case
    description: Describe your use case for this feature
    placeholder: |
      As a [type of user], I want to [goal] so that [benefit]
  validations:
    required: true

- type: textarea
  id: additional
  attributes:
    label: Additional Context
    description: Add any other context, screenshots, or examples about the feature request

- type: checkboxes
  id: contribution
  attributes:
    label: Contribution Interest
    description: Would you be willing to contribute to this feature?
    options:
    - label: I'm interested in implementing this feature

- type: checkboxes
  id: terms
  attributes:
    label: Code of Conduct
    description: By submitting this issue, you agree to follow our Code of Conduct
    options:
    - label: I agree to follow this project's Code of Conduct
      required: true

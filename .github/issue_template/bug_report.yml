name: Bug Report
description: Report a bug or unexpected behavior
title: '[Bug]: '
labels: [bug, triage]
body:
- type: markdown
  attributes:
    value: |
      Thanks for taking the time to report a bug! Please fill out the form below.

- type: dropdown
  id: package
  attributes:
    label: Which package is affected?
    description: Select the package where you encountered the bug
    options:
    - legesher-core (Core translation engine)
    - legesher-i18n (Language data)
    - legesher-vs-code (VS Code extension)
    - legesher (Main CLI/library)
    - legesher-pride (Community features)
    - Documentation
    - Other/Multiple packages
  validations:
    required: true

- type: textarea
  id: description
  attributes:
    label: Bug Description
    description: A clear and concise description of what the bug is
    placeholder: Tell us what you see!
  validations:
    required: true

- type: textarea
  id: reproduction
  attributes:
    label: Steps to Reproduce
    description: Steps to reproduce the behavior
    placeholder: |
      1. Install package with '...'
      2. Run command '...'
      3. See error
  validations:
    required: true

- type: textarea
  id: expected
  attributes:
    label: Expected Behavior
    description: What did you expect to happen?
    placeholder: I expected...
  validations:
    required: true

- type: textarea
  id: actual
  attributes:
    label: Actual Behavior
    description: What actually happened?
    placeholder: Instead, I saw...
  validations:
    required: true

- type: textarea
  id: environment
  attributes:
    label: Environment
    description: Please provide information about your environment
    placeholder: |
      - OS: [e.g., macOS 14, Ubuntu 22.04, Windows 11]
      - Python version: [e.g., 3.13.0]
      - Package version: [e.g., 0.0.1]
      - Editor: [e.g., VS Code 1.85.0]
  validations:
    required: true

- type: textarea
  id: logs
  attributes:
    label: Relevant Logs or Error Messages
    description: If applicable, paste any relevant logs or error messages
    render: shell

- type: textarea
  id: additional
  attributes:
    label: Additional Context
    description: Add any other context about the problem here

- type: checkboxes
  id: terms
  attributes:
    label: Code of Conduct
    description: By submitting this issue, you agree to follow our Code of Conduct
    options:
    - label: I agree to follow this project's Code of Conduct
      required: true

[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"

[project]
authors = [
    {name = "Madison (Pfaff) Edgar", email = "7844510+madiedgar@users.noreply.github.com"}
]
license = {text = "LicenseRef-Proprietary"}
requires-python = ">=3.10,<4.0"
dependencies = [
    "legesher>=0.1.0,<0.2.0",
    "legesher-core>=0.1.0,<0.2.0",
    "legesher-i18n>=0.1.0,<0.2.0",
]
name = "legesher-home"
version = "0.1.0"
description = "Digital home and community platform for Legesher"
readme = "README.md"
keywords = ["community", "digital-home", "portfolio", "showcase", "developer-community"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: Other/Proprietary License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development",
    "Operating System :: OS Independent",
    "Private :: Do Not Upload",
]

[tool.uv.sources]
legesher-core = { path = "../core", editable = true }
legesher-i18n = { path = "../i18n", editable = true }
legesher = { path = "../legesher", editable = true }

[tool.semantic_release]
version_variable = "legesher_home/__init__.py:__version__"
version_toml = "pyproject.toml:project.version"
commit_parser = "angular"
major_on_zero = true
allow_zero_version = true
branch = "main"
tag_format = "home-v{version}"
upload_to_vcs_release = true
upload_to_pypi = false

[tool.semantic_release.commit_parser_options]
allowed_tags = [
    "feat", "fix", "docs", "style", "refactor",
    "perf", "test", "build", "ci", "chore", "revert"
]

[tool.semantic_release.changelog]
exclude_commit_patterns = [
    "^chore\\(release\\):",
    "^Merge",
]

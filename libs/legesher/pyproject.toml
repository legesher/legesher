[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"

[project]
authors = [
    {name = "Madison (Pfaff) Edgar", email = "7844510+madiedgar@users.noreply.github.com"}
]
license = {text = "Apache-2.0"}
requires-python = ">=3.10,<4.0"
dependencies = [
    "click>=8.0.0",
    "pyyaml>=6.0",
    "questionary>=2.0.0",
    "tomli>=2.0.0; python_version < '3.11'",
    # The CLI exposes the tree-sitter backend (translate --full, identifier
    # maps), so it needs the optional extra that ships the C extensions.
    # Sibling ranges ship in the wheel metadata; in-repo the workspace
    # override in the root [tool.uv.sources] applies. <1.0.0 because
    # semantic-release (major_on_zero = true) moves 0.x to 1.0 on a
    # breaking change.
    "legesher-core[treesitter]>=0.22.0,<1.0.0",
    "legesher-i18n>=0.22.0,<1.0.0",
    "legesher-runtime>=0.1.0,<1.0.0",
]
name = "legesher"
version = "0.22.0"
description = "main build for Legesher Monorepo"
readme = "README.md"
keywords = ["translation", "programming", "multilingual", "i18n", "cli", "developer-tools"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Software Development :: Internationalization",
    "Topic :: Software Development :: Localization",
    "Operating System :: OS Independent",
]

[project.scripts]
legesher = "legesher.cli.main:cli"

[tool.uv.sources]
legesher-core = { workspace = true }
legesher-i18n = { workspace = true }
legesher-runtime = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.23.0",
    "pytest-benchmark>=5.1.0",
    "ruff>=0.1.0",
    "black>=24.0.0",
    "mypy>=1.8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "-v",
]
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "slow: Slow-running tests",
]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false  # Start lenient, can tighten later
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
strict_equality = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
check_untyped_defs = false

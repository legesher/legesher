[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"

[project]
authors = [
    {name = "Madison (Pfaff) Edgar", email = "7844510+madiedgar@users.noreply.github.com"}
]
license = {text = "Apache-2.0"}
requires-python = ">=3.10,<4.0"
dependencies = [
    "click>=8.0.0",
    "legesher-i18n",
    "pyyaml>=6.0",
    "tree-sitter>=0.20.4",
    "tree-sitter-python>=0.21.0",
]
name = "legesher-core"
version = "0.11.1"
description = "Core library for Legesher Monorepo"
readme = "README.md"
keywords = ["translation", "i18n", "programming", "multilingual", "code-translation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Internationalization",
    "Topic :: Software Development :: Localization",
    "Operating System :: OS Independent",
]

[project.scripts]
legesher-filter = "legesher_core.__main__:main"

[tool.pdm.build]
# Include the whole package directory so non-.py files ship in the wheel.
# Specifically needed for PEP 561 `py.typed` marker — without an explicit
# includes list, pdm-backend's default picks up only .py files and the
# marker is silently stripped. Matches the pattern in libs/i18n/pyproject.toml.
includes = ["legesher_core/"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.23.0",
    "pytest-benchmark>=4.0.0",
    "ruff>=0.1.0",
    "black>=24.0.0",
    "mypy>=1.8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "-v",
]
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "slow: Slow-running tests",
]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false  # Start lenient, can tighten later
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
strict_equality = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
check_untyped_defs = false

[tool.black]
extend-exclude = "tests/fixtures/sample_spanish.py"

[tool.ruff]
extend-exclude = ["tests/fixtures/sample_spanish.py"]

[tool.uv.sources]
legesher-i18n = { workspace = true }

# Python Version Index
# Tracks keyword changes across Python versions for language pack inheritance

python_versions:
  '3.10':
    added_keywords:
    - match                # PEP 634: Structural Pattern Matching
    - case                 # PEP 634: Structural Pattern Matching
    removed_keywords: []
    base:                  # Base version (no inheritance for MVP)

  '3.11':
    added_keywords:
    - except*              # PEP 654: Exception Groups
    removed_keywords: []
    base: '3.10'

  '3.12':
    added_keywords:
    - type                 # PEP 695: Type Parameter Syntax
    removed_keywords: []
    base: '3.11'

  '3.13':
    added_keywords: []     # No new keywords in Python 3.13
    removed_keywords: []
    base: '3.12'

# Configuration for automatic updates
auto_update:
  enabled: true
  source: https://docs.python.org/3/reference/lexical_analysis.html
  check_interval: monthly

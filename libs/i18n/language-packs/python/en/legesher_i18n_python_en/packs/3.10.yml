# English Language Pack for Python 3.10+
# Base pack with all core keywords and Python 3.10 additions (match/case)
# English is the canonical language - all keywords map to themselves

language: en
target: python
version: '3.10'

keywords:
  # Core keywords (Python 3.x)
  and: and
  as: as
  assert: assert
  async: async
  await: await
  break: break
  class: class
  continue: continue
  def: def
  del: del
  elif: elif
  else: else
  except: except
  'False': 'False'
  finally: finally
  for: for
  from: from
  global: global
  if: if
  import: import
  in: in
  is: is
  lambda: lambda
  None: None
  nonlocal: nonlocal
  not: not
  or: or
  pass: pass
  raise: raise
  return: return
  'True': 'True'
  try: try
  while: while
  with: with
  yield: yield

  # Python 3.10+ specific (PEP 634: Structural Pattern Matching)
  match: match
  case: case

builtins:
  # Built-in functions
  abs: abs
  aiter: aiter
  all: all
  anext: anext
  any: any
  ascii: ascii
  bin: bin
  breakpoint: breakpoint
  callable: callable
  chr: chr
  compile: compile
  delattr: delattr
  dir: dir
  divmod: divmod
  enumerate: enumerate
  eval: eval
  exec: exec
  filter: filter
  format: format
  getattr: getattr
  globals: globals
  hasattr: hasattr
  hash: hash
  help: help
  hex: hex
  id: id
  input: input
  isinstance: isinstance
  issubclass: issubclass
  iter: iter
  len: len
  locals: locals
  map: map
  max: max
  min: min
  next: next
  oct: oct
  open: open
  ord: ord
  pow: pow
  print: print
  range: range
  repr: repr
  reversed: reversed
  round: round
  setattr: setattr
  slice: slice
  sorted: sorted
  sum: sum
  vars: vars
  zip: zip

  # Built-in types
  bool: bool
  bytearray: bytearray
  bytes: bytes
  classmethod: classmethod
  complex: complex
  dict: dict
  float: float
  frozenset: frozenset
  int: int
  list: list
  memoryview: memoryview
  object: object
  property: property
  set: set
  staticmethod: staticmethod
  str: str
  super: super
  tuple: tuple

  # Exceptions
  attributeerror: attributeerror
  baseexception: baseexception
  exception: exception
  indexerror: indexerror
  keyerror: keyerror
  nameerror: nameerror
  runtimeerror: runtimeerror
  stopiteration: stopiteration
  typeerror: typeerror
  valueerror: valueerror

  # Special constants
  ellipsis: ellipsis
  notimplemented: notimplemented

metadata:
  python_version_min: '3.10'
  python_version_max: '3.14'
  compatibility_tested:
  - '3.10'
  - '3.11'
  - '3.12'
  - '3.13'
  - '3.14'
  last_updated: '2025-11-16'
  community_reviewed: true
  author: Legesher Team
  license: MIT

# Japanese base pack (Python 3.10+ floor).
#
# CORE-1905: `divmod` is carried here WITHOUT the U+30FB KATAKANA MIDDLE DOT
# that separates the two halves of its canonical reading. U+30FB became a valid
# identifier character only in CPython 3.13 (Unicode 15.1 XID); on 3.10-3.12
# `ディビジョン・モジュール` is a hard SyntaxError. The canonical spelling lives in
# 3.13.yml (the 3.13+ overlay) and in translations.db; the dot-free
# `ディビジョンモジュール` here is the same reading with the separator removed.
# This base pack therefore deliberately DIVERGES from the DB for that one value
# — an intentional interpreter-compat downgrade, not drift. Same mechanism as
# Sinhala's ZWJ conjuncts (CORE-1521).


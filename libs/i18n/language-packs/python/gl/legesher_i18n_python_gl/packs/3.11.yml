# Galician Language Pack for Python 3.11+
# Extends 3.10 pack and adds except* for exception groups

language: gl
target: python
version: '3.11'
extends: 3.10.yml
keywords:
  except*: agasde*
exceptions:
  baseexceptiongroup: grupoexcepcionbase
  exceptiongroup: grupoexcepcion
metadata:
  python_version_min: '3.11'
  python_version_max: '3.13'
  compatibility_tested:
  - '3.11'
  - '3.12'
  - '3.13'
  last_updated: '2026-03-15'
  community_reviewed: false
  author: Legesher Team
  license: Apache-2.0

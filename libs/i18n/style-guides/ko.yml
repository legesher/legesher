# ko.yml — Korean Python style guide
# Korean (한국어) — Hangul, left-to-right.
# A profile of best-practice Python for Korean: which conventions the script
# can express and the constraints its characters impose. Rules only — vocabulary
# (word choices, symbol names) lives in the language packs.

language: "ko"
extends:
- python.yml
- _ltr.yml
- _cjk.yml
version: 0.1.0
status: experimental

# Which Python naming conventions this script can express, plus profile facts.
supports:
  case_distinction: false
  snake_case: true
  upper_snake_case: false
  pascal_case: false
  camel_case: false
  native_digits: true
  combining_marks: false
  requires_word_separator: false
  diacritics_in_identifiers: false
  cursive_joining: false

# How identifiers are formed.
naming:
  case_substitute: morphology
  detail: >
    No letter case exists; part of speech carries what PEP 8 case carries
    — callables are verb phrases, classes and exceptions are noun compounds.
    A single-word name stays bare; a multi-word idea joins with underscores.
    Constants are not marked with a prefix word (there is no ALL_CAPS form).

# Script identity + the constraints its characters impose.
script:
  name: "Hangul"
  direction: ltr
  constraints:
  - "Hangul blocks delimit syllables, not words; underscores between logical words aid readability in multi-word identifiers."
  - "Digits: Korean natively uses fullwidth １２３; code uses ASCII 0-9 today. Native-digit support is a planned Legesher feature (currently ASCII-only)."

# Formatting rules.
formatting:
  comment_prefix: "#"
  programming_punctuation: ascii_only
  docstrings: PEP 257 structure, prose in Korean

# Editor rendering (VS Code extension, not the translation prompt).
rendering:
  noto_font: "Noto Sans KR"

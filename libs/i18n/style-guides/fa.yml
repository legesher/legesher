# fa.yml — Persian Python style guide
# Persian (فارسی) — Perso-Arabic, right-to-left.
# A profile of best-practice Python for Persian: which conventions the script
# can express and the constraints its characters impose. Rules only — vocabulary
# (word choices, symbol names) lives in the language packs.

language: "fa"
extends:
- python.yml
- _rtl.yml
- _arabic.yml
version: 0.1.0
status: experimental

# Which Python naming conventions this script can express, plus profile facts.
supports:
  case_distinction: false
  snake_case: true
  upper_snake_case: false
  pascal_case: false
  camel_case: false
  native_digits: true
  combining_marks: true
  requires_word_separator: false
  diacritics_in_identifiers: false
  cursive_joining: true

# How identifiers are formed.
naming:
  case_substitute: morphology
  detail: >
    No letter case exists; part of speech carries what PEP 8 case carries
    — callables are verb phrases, classes and exceptions are noun compounds.
    A single-word name stays bare; a multi-word idea joins with underscores.
    Constants are not marked with a prefix word (there is no ALL_CAPS form).

# Script identity + the constraints its characters impose.
script:
  name: "Perso-Arabic"
  direction: rtl
  constraints:
  - "Python accepts ZWNJ (U+200C) as a medial identifier character, so a form with it and one without are DIFFERENT names that render identically — forbid ZWNJ by codepoint and separate logical words with an underscore. Persian identifiers must use keheh (ک, U+06A9) not Arabic kaf (U+0643), and Farsi yeh (ی, U+06CC) not Arabic yeh (U+064A); NFKC does not unify these look-alikes. Use the standard Arabic block; avoid presentation forms (U+FB50–FDFF, U+FE70–FEFF)."
  - "Omit vowel diacritics (harakat / tashkil) in identifiers — write the bare consonantal skeleton."
  - "Digits: Persian natively uses ۰۱۲۳; code uses ASCII 0-9 today. Native-digit support is a planned Legesher feature (currently ASCII-only)."

# Formatting rules.
formatting:
  comment_prefix: "#"
  programming_punctuation: ascii_only
  docstrings: PEP 257 structure, prose in Persian

# Editor rendering (VS Code extension, not the translation prompt).
rendering:
  noto_font: "Noto Sans Arabic"   # Persian letters پ چ ژ گ; Naskh style

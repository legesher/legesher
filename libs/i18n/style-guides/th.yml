# th.yml — Thai Python style guide
# Thai (ไทย) — Thai, left-to-right.
# A profile of best-practice Python for Thai: which conventions the script
# can express and the constraints its characters impose. Rules only — vocabulary
# (word choices, symbol names) lives in the language packs.

language: "th"
extends:
- python.yml
- _ltr.yml
- _sea-spaceless.yml
version: 0.1.0
status: experimental

# Which Python naming conventions this script can express, plus profile facts.
supports:
  case_distinction: false
  snake_case: true
  upper_snake_case: false
  pascal_case: false
  camel_case: false
  native_digits: true
  combining_marks: true
  requires_word_separator: true
  diacritics_in_identifiers: true
  cursive_joining: false

# How identifiers are formed.
naming:
  case_substitute: morphology
  detail: >
    No letter case exists; part of speech carries what PEP 8 case carries
    — callables are verb phrases, classes and exceptions are noun compounds.
    A single-word name stays bare; a multi-word idea joins with underscores.
    Constants are not marked with a prefix word (there is no ALL_CAPS form).

# Script identity + the constraints its characters impose.
script:
  name: "Thai"
  direction: ltr
  constraints:
  - "Prose is spaceless — underscores between logical words are REQUIRED. Thai has no case."
  - "CRITICAL: U+0E33 (SARA AM ำ) decomposes under NFKC, so an identifier containing it differs from the runtime token. Prefer forms that avoid it; any term needing it is reviewer-pending until regenerated NFKC-stable."
  - "Digits: Thai natively uses ๑๒๓; code uses ASCII 0-9 today. Native-digit support is a planned Legesher feature (currently ASCII-only)."

# Formatting rules.
formatting:
  comment_prefix: "#"
  programming_punctuation: ascii_only
  docstrings: PEP 257 structure, prose in Thai

# Editor rendering (VS Code extension, not the translation prompt).
rendering:
  noto_font: "Noto Sans Thai"

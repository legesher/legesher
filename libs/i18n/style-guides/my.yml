# my.yml — Burmese Python style guide
# Burmese (မြန်မာ) — Myanmar, left-to-right.
# A profile of best-practice Python for Burmese: which conventions the script
# can express and the constraints its characters impose. Rules only — vocabulary
# (word choices, symbol names) lives in the language packs.

language: "my"
extends:
- python.yml
- _ltr.yml
- _sea-spaceless.yml
version: 0.1.0
status: experimental

# Which Python naming conventions this script can express, plus profile facts.
supports:
  case_distinction: false
  snake_case: true
  upper_snake_case: false
  pascal_case: false
  camel_case: false
  native_digits: true
  combining_marks: true
  requires_word_separator: true
  diacritics_in_identifiers: true
  cursive_joining: false

# How identifiers are formed.
naming:
  case_substitute: morphology
  detail: >
    No letter case exists; part of speech carries what PEP 8 case carries
    — callables are verb phrases, classes and exceptions are noun compounds.
    A single-word name stays bare; a multi-word idea joins with underscores.
    Constants are not marked with a prefix word (there is no ALL_CAPS form).

# Script identity + the constraints its characters impose.
script:
  name: "Myanmar"
  direction: ltr
  constraints:
  - "Prose is written without spaces, so underscores between logical words are REQUIRED for a readable identifier. Stacked consonants use virama; keep identifiers NFKC-stable."
  - "Digits: Burmese natively uses ၁၂၃; code uses ASCII 0-9 today. Native-digit support is a planned Legesher feature (currently ASCII-only)."

# Formatting rules.
formatting:
  comment_prefix: "#"
  programming_punctuation: ascii_only
  docstrings: PEP 257 structure, prose in Burmese

# Editor rendering (VS Code extension, not the translation prompt).
rendering:
  noto_font: "Noto Sans Myanmar"

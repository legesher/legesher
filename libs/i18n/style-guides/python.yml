# python.yml — Base node of the Legesher style-guide extends chain.
#
# The machine-readable rules live in each per-language {code}.yml guide, which is
# self-contained on the rules/profile schema (see README.md and _schema.json).
# This base — and the _ltr/_rtl direction nodes and the _cjk/_arabic/… family
# nodes — carry NO content keys, so nothing old-schema leaks into a merged guide
# when the loader resolves the extends chain. They structure and document the
# chain; the machine-readable content is per-language.
#
# Universal PEP 8 baseline (documented for humans; enforced per-guide and by the
# pack validation gate): 4-space indentation; snake_case with underscores between
# words; ASCII programming punctuation; ASCII digits in code; identifiers are
# NFKC fixed points with no zero-width joiners.

language: python
extends: []
version: 0.1.0
status: experimental

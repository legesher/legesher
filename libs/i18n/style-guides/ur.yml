# ur.yml — Urdu style guide for Legesher translations
# Extends base Python conventions and RTL text direction.
# Targets Modern Standard Urdu in Nastaliq Arabic script.

language: ur
extends:
- python.yml
- _rtl.yml
version: 0.1.0
status: experimental

# ---------------------------------------------------------------------------
# Precedent
# ---------------------------------------------------------------------------
# There is no precedent — this will be the first Urdu programming experience.
# Legesher is pioneering Urdu-language coding. Extra care must be taken to
# establish conventions that feel natural to Urdu speakers while remaining
# technically sound as Python identifiers.

# ---------------------------------------------------------------------------
# Naming conventions
# ---------------------------------------------------------------------------
naming:
  snake_case:
    usage: variables, functions, methods, parameters
    rule: Urdu words joined by underscores for multi-word identifiers
    examples:
    - حاصل_جمع (calculate_sum)
    - قدر_حاصل (get_value)

  pascal_case:
    usage: class names, exception names
    rule: >
      No case distinction in Urdu script — concatenate words directly.
      Word boundaries are inferred from context.
    examples:
    - قدرغلطی (ValueError)
    - قسمغلطی (TypeError)

  upper_snake_case:
    usage: constants
    rule: No case distinction — use underscores or context to indicate constants

  compound_words:
    strategy: underscore
    detail: >
      Join multi-word concepts with underscores for readability.
      Urdu connected script can make concatenated words hard to parse.
      Underscores provide clear word boundaries.
    max_words: 3
    max_characters: 10
    examples:
    - isinstance -> ہے_مثال
    - hasattr -> ہے_صفت

  word_boundaries:
    strategy: underscores
    detail: >
      Urdu Nastaliq script connects letters within words. Without
      underscores, compound identifiers become a single visual block
      that is difficult to parse. Use underscores between logical words.

# ---------------------------------------------------------------------------
# Script rules
# ---------------------------------------------------------------------------
script:
  native_required: true
  variant: Nastaliq Arabic script (Urdu)
  direction: right-to-left
  detail: >
    All translations MUST use Urdu Nastaliq script. Do NOT use
    Devanagari (Hindi), Latin transliteration, or Roman Urdu.
    The model may confuse Urdu with Farsi — explicitly verify
    that output is in Urdu script, not Persian.

  latin_mixing:
    rule: >
      AVOID Latin script in identifiers. Use Urdu script exclusively.
      Technical abbreviations may appear in comments or strings only.

  accent_handling:
    rule: >
      Do NOT use diacritics (tashkeel/i'rab marks) in identifiers.
      No zabar (fatha), zer (kasra), pesh (damma), or other vowel marks.
      Urdu readers expect unvocalized text in technical contexts.

  keyboard_input:
    rule: >
      All translations must be typeable on a standard Urdu keyboard layout
      (Phonetic or InPage). Do not require special character maps.
    detail: >
      Use characters from the standard Urdu alphabet (38 letters).
      Avoid rare Arabic characters not on standard Urdu keyboards.

  unicode_blocks:
    rule: >
      Use standard Arabic block (U+0600 to U+06FF) which covers all
      Urdu characters. AVOID:
      - Extended Arabic-A (U+08A0-U+08FF)
      - Arabic Presentation Forms (U+FB50-U+FDFF, U+FE70-U+FEFF)
      - Arabic Supplement (U+0750-U+077F)

  urdu_vs_farsi:
    rule: >
      Urdu and Farsi share the Arabic script but have different vocabularies.
      Use Urdu-specific words, not Farsi equivalents. Key Urdu-specific
      characters: ٹ (tte), ڈ (ddal), ڑ (rre), ں (noon ghunna), ے (bari ye),
      ھ (do-chashmee he). If the translation uses none of these characters,
      double-check that it is Urdu and not Farsi or Arabic.

# ---------------------------------------------------------------------------
# Translation conventions
# ---------------------------------------------------------------------------
translation:
  register: modern-standard-urdu
  detail: >
    Use Modern Standard Urdu technical terms. Prefer Urdu-native words
    over pure Arabic loanwords unless the Arabic term is already standard
    in Urdu CS/technical contexts (e.g., from university curricula).
  good_examples:
  - واپسی (return) — natural Urdu word
  - چھاپ (print) — common Urdu word for printing
  - درآمد (import) — standard Urdu
  bad_examples:
  - ارجاع (return) — pure Arabic, not natural in Urdu
  - طباعت (print) — formal Arabic, use Urdu چھاپ instead
  - Urdu transliteration of English words — avoid entirely

  verb_form:
    rule: masdar (verbal noun) form for action keywords
    detail: >
      The masdar is the base/citation form of Urdu verbs, equivalent to
      the infinitive in European languages. It is the most neutral and
      widely understood form.
    examples:
    - def -> تعریف (taarif — definition/defining)
    - return -> واپسی (vaapsi — returning)
    - print -> چھاپ (chhaap — printing)
    - import -> درآمد (daraamad — importing)

  noun_form:
    rule: Singular indefinite form for type names
    examples:
    - list -> فہرست (fehrist)
    - dict -> لغت (lughat)
    - str -> تار (taar — string/thread)
    - int -> عدد (adad — number)

  boolean_constants:
    form: Adjective or state word
    examples:
    - True -> سچ (sach — true)
    - False -> جھوٹ (jhoot — false)
    - None -> کچھ_نہیں (kuchh nahi — nothing)

  transliteration:
    policy: AVOID — translate concepts, not English sounds
    detail: >
      Do NOT transliterate English programming terms into Urdu script.
      LLMs frequently produce transliterations instead of translations
      for Urdu. Always verify the output is a semantic translation.
    bad_examples:
    - پرنٹ (print transliterated) — use چھاپ instead
    - ریٹرن (return transliterated) — use واپسی instead
    - ڈیفائن (define transliterated) — use تعریف instead
    - امپورٹ (import transliterated) — use درآمد instead

  compound_consistency:
    rule: >
      All compound terms must follow consistent patterns within the pack.
      Use the same verb+noun structure across related term families.
    pattern_families:
    - 'حاصل/مقرر/حذف + صفت: parallel pattern for getattr/setattr/delattr'
    - 'ہے + قسم: consistent prefix for isinstance, issubclass'

# ---------------------------------------------------------------------------
# Formatting conventions
# ---------------------------------------------------------------------------
formatting:
  comment_prefix: '#'

  docstring_style:
    rule: Triple-quoted strings with Urdu text, right-to-left flow
    example: |
      """دو اعداد کا مجموعہ حساب کریں۔

      دلائل:
          الف: پہلا عدد
          ب: دوسرا عدد

      واپسی:
          دونوں اعداد کا مجموعہ
      """

  punctuation:
    rule: >
      Use ASCII punctuation for ALL programming constructs.
      Do NOT use Urdu/Arabic punctuation variants in code:
      no Arabic comma (،), no Arabic semicolon (؛),
      no Urdu full stop (۔), no RTL question mark (؟).
      Urdu punctuation is acceptable ONLY inside string literals.

  digits:
    rule: >
      Use ASCII digits (0-9) for all numeric literals.
      Do NOT use Extended Arabic-Indic digits (۰-۹) in code.
      Urdu numerals are acceptable only inside string literals.

  alignment:
    rule: >
      Source code is stored left-aligned with standard 4-space indentation.
      RTL display is handled by the editor, not by the source file.

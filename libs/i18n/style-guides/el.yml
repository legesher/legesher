# el.yml — Greek Python style guide
# Greek (Ελληνικά) — Greek, left-to-right.
# A profile of best-practice Python for Greek: which conventions the script
# can express and the constraints its characters impose. Rules only — vocabulary
# (word choices, symbol names) lives in the language packs.

language: "el"
extends:
- python.yml
- _ltr.yml
version: 0.1.0
status: experimental

# Which Python naming conventions this script can express, plus profile facts.
supports:
  case_distinction: true
  snake_case: true
  upper_snake_case: true
  pascal_case: true
  camel_case: true
  native_digits: false
  combining_marks: false
  requires_word_separator: false
  diacritics_in_identifiers: true
  cursive_joining: false

# How identifiers are formed.
naming:
  case_substitute: not_needed
  detail: >
    Greek has letter case; snake_case / CapWords / UPPER_SNAKE apply as in
    PEP 8. A single-word name stays bare; a multi-word idea joins with underscores.

# Script identity + the constraints its characters impose.
script:
  name: "Greek"
  direction: ltr
  constraints:
  - "Greek script is bicameral; PEP 8 casing applies. Final sigma ς is positional. Modern (monotonic) Greek: the tonos accent on vowels is a valid identifier char. verb_form uses the verbal noun (ορισμός) as the citation form."
  - "Digits: written with ASCII 0-9."

# Formatting rules.
formatting:
  comment_prefix: "#"
  programming_punctuation: ascii_only
  docstrings: PEP 257 structure, prose in Greek

# Editor rendering (VS Code extension, not the translation prompt).
rendering:
  noto_font: "Noto Sans"   # covers Greek

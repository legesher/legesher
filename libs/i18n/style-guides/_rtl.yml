# _rtl.yml — Right-to-left text direction conventions
# Applies to all RTL-script languages (Arabic, Hebrew, Urdu, Farsi, etc.).
# Language-specific guides extend this file alongside python.yml.

language: _rtl
extends:
- python.yml
version: 0.1.0
status: experimental

# ---------------------------------------------------------------------------
# Text direction
# ---------------------------------------------------------------------------
naming:
  text_direction: right-to-left
  detail: >
    Natural-language text flows right-to-left, but Python source files
    are stored with LTR byte order. Identifiers are stored LTR in source
    but displayed RTL by the editor's Unicode Bidirectional Algorithm.

  max_keyword_length: 10
  keyword_length_rationale: >
    RTL keywords should be 10 characters or fewer. Shorter keywords improve
    visual clarity in mixed-direction source code where RTL identifiers sit
    alongside LTR operators and punctuation.

# ---------------------------------------------------------------------------
# Script conventions for RTL languages
# ---------------------------------------------------------------------------
script:
  native_required: true
  # Note: ``has_case_distinction`` lives in ``languages.json`` (next to
  # ``rtl``) -- single source of truth for language script properties.
  # Style guides can still override per-language by setting the field
  # under ``script:``, but the default for the whole RTL family
  # (no upper/lowercase distinction) is encoded in languages.json.

  latin_mixing:
    rule: >
      AVOID Latin script in identifiers. Use native script exclusively.
      Technical abbreviations (API, HTTP) may appear in comments or strings
      but should not be used as identifier names.

  accent_handling:
    rule: >
      Do NOT use diacritics in keywords or identifiers.
      Arabic: no tashkeel (fatha, damma, kasra, sukun, shadda, tanwin).
      Hebrew: no niqqud (vowel points).
      Urdu: no zabar, zer, pesh.
      Diacritics reduce readability and are not consistently typed.

  unicode_blocks:
    rule: >
      Use standard Arabic block (U+0600 to U+06FF) for Arabic, Urdu, Farsi.
      Use standard Hebrew block (U+0590 to U+05FF) for Hebrew.
      AVOID extended Arabic blocks (U+0750-U+077F, U+FB50-U+FDFF, U+FE70-U+FEFF).
      AVOID presentation forms — use base characters only.

  keyboard_input:
    rule: >
      All translations MUST be typeable on a standard keyboard layout for
      the target language without switching input methods. Do not require
      special character maps or copy-paste.

  bidirectional:
    handling: unicode-bidi-algorithm
    detail: >
      Mixed directionality (RTL identifiers + LTR operators/punctuation)
      is handled by the Unicode Bidirectional Algorithm (UAX #9).
      No explicit directional marks (LRM, RLM) should be embedded in source.

# ---------------------------------------------------------------------------
# Programming punctuation — ALWAYS LTR ASCII
# ---------------------------------------------------------------------------
formatting:
  comment_prefix: '#'

  punctuation:
    rule: >
      ALL programming punctuation MUST remain standard ASCII LTR characters.
      Do NOT substitute language-specific punctuation variants.
    prohibited:
    - Arabic comma (U+060C) — use ASCII comma (U+002C) instead
    - Arabic semicolon (U+061B) — use ASCII semicolon (U+003B) instead
    - Arabic question mark (U+061F) — use ASCII question mark (U+003F) instead
    - Arabic-Indic digits (U+0660-U+0669) — use ASCII digits 0-9 instead
    allowed: '( ) : , . ; [ ] { } + - * / = < > ! @ # $ % ^ & | ~ `'

  docstring_style:
    rule: >
      Use triple-quoted strings for docstrings, text written in RTL script.
      The editor handles RTL rendering; no special markup needed.

  alignment:
    rule: >
      Code indentation uses standard 4-space PEP 8 style (left-side indentation).
      Future RTL-native editors may support right-aligned indentation,
      but current tooling assumes left-aligned source files.

# ---------------------------------------------------------------------------
# Translation conventions (RTL-specific)
# ---------------------------------------------------------------------------
translation:
  register: inherited from python.yml — technical-standard

  verb_form:
    rule: Use the verbal noun (masdar) form for action keywords in Arabic-script languages
    detail: >
      Arabic: masdar form (e.g., taarif for define).
      Hebrew: binyan form appropriate for the action.
      Urdu: masdar form.

  noun_form:
    rule: Use singular indefinite form for type names

  transliteration:
    policy: >
      AVOID transliteration. Translate the CONCEPT, not the English sound.
      RTL languages are especially prone to transliteration errors where
      models produce phonetic renderings instead of semantic translations.
      Example: 'print' should become the native word for 'display/output',
      NOT a phonetic spelling of 'print' in Arabic/Hebrew/Urdu script.

  compound_words:
    strategy: >
      Join with underscore for multi-word concepts.
      Keep total length under 10 characters when possible.
      Prefer single-word native equivalents over compound translations.

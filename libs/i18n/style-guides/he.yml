# he.yml — Hebrew Python style guide
# Hebrew (עברית) — Hebrew, right-to-left.
# A profile of best-practice Python for Hebrew: which conventions the script
# can express and the constraints its characters impose. Rules only — vocabulary
# (word choices, symbol names) lives in the language packs.

language: "he"
extends:
- python.yml
- _rtl.yml
version: 0.1.0
status: experimental

# Which Python naming conventions this script can express, plus profile facts.
supports:
  case_distinction: false
  snake_case: true
  upper_snake_case: false
  pascal_case: false
  camel_case: false
  native_digits: false
  combining_marks: true
  requires_word_separator: false
  diacritics_in_identifiers: false
  cursive_joining: false

# How identifiers are formed.
naming:
  case_substitute: morphology
  detail: >
    No letter case exists; part of speech carries what PEP 8 case carries
    — callables are verb phrases, classes and exceptions are noun compounds.
    A single-word name stays bare; a multi-word idea joins with underscores.
    Constants are not marked with a prefix word (there is no ALL_CAPS form).

# Script identity + the constraints its characters impose.
script:
  name: "Hebrew"
  direction: rtl
  constraints:
  - "Hebrew is NOT Arabic script and has no family overlay — this guide states the caseless conventions directly. Final-form letters ך ם ן ף ץ are positional; use them only word-finally as normal."
  - "Identifiers must be NFKC fixed points; do not use precomposed letter+point forms — write bare consonants."
  - "Omit vowel diacritics (niqqud) in identifiers — write the bare consonantal skeleton."
  - "Digits: written with ASCII 0-9."

# Formatting rules.
formatting:
  comment_prefix: "#"
  programming_punctuation: ascii_only
  docstrings: PEP 257 structure, prose in Hebrew

# Editor rendering (VS Code extension, not the translation prompt).
rendering:
  noto_font: "Noto Sans Hebrew"

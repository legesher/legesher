[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"

[project]
authors = [
    {name = "Madison (Pfaff) Edgar", email = "7844510+madiedgar@users.noreply.github.com"}
]
license = {text = "MIT"}
requires-python = "<4.0,>=3.13"
dependencies = [
    "packaging>=23.0",
    "pydantic>=2.0",
    "pyyaml>=6.0",
]
name = "legesher-i18n"
version = "0.0.1"
description = "i18n for Legesher Monorepo"
readme = "README.md"
keywords = ["translation", "i18n", "l10n", "programming", "multilingual", "languages"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Internationalization",
    "Topic :: Software Development :: Localization",
    "Operating System :: OS Independent",
]

[tool.uv.sources]
legesher-core = { path = "../core", editable = true }

[dependency-groups]
dev = [
    "pytest>=8.4.2",
    "pytest-cov>=7.0.0",
]

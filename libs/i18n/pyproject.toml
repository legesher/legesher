[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"

[project]
authors = [
    {name = "Madison (Pfaff) Edgar", email = "7844510+madiedgar@users.noreply.github.com"}
]
license = {text = "MIT"}
requires-python = ">=3.10,<4.0"
dependencies = [
    "packaging>=23.0",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "tomli>=2.0.0; python_version<'3.11'",
    "click>=8.0.0",
    "rich>=13.0.0",
    "anthropic>=0.72.1",
    "jinja2>=3.1.6",
    "ollama>=0.6.0",
]
name = "legesher-i18n"
version = "0.6.0"
description = "i18n for Legesher Monorepo"
readme = "README.md"
keywords = ["translation", "i18n", "l10n", "programming", "multilingual", "languages"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Internationalization",
    "Topic :: Software Development :: Localization",
    "Operating System :: OS Independent",
]

[project.scripts]
legesher-i18n = "legesher_i18n.cli:cli"
legesher-api = "legesher_i18n.api.cli:main"

[tool.pdm.build]
includes = ["legesher_i18n/"]
custom-hook = "pdm_build.py"

[tool.uv.sources]
legesher-core = { workspace = true }

[project.optional-dependencies]
# Translation API providers (optional)
api = [
    "deepl>=1.16.0",  # DeepL API
    "google-cloud-translate>=3.15.0",  # Google Translate API
    "httpx>=0.25.0",  # For LibreTranslate HTTP client
    "redis>=5.0.0",  # Redis cache backend (optional)
]

# Hugging Face transformers for Aya-101 model (optional, ~2GB with PyTorch)
ml = [
    "transformers>=4.30.0",  # Hugging Face transformers library
    "torch>=2.0.0",  # PyTorch (CPU version, users can install CUDA variant separately)
    "accelerate>=0.20.0",  # For efficient model loading
    "sentencepiece>=0.1.99",  # Required for some tokenizers
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.1.0",
    "black>=24.0.0",
    "mypy>=1.8.0",
    "types-PyYAML>=6.0",
    "deepl>=1.16.0",  # For testing
    "google-cloud-translate>=3.15.0",  # For testing
    "httpx>=0.25.0",  # For testing
    "redis>=5.0.0",  # For testing
    "pytest-mock>=3.12.0",  # For mocking
    "responses>=0.24.0",  # For HTTP mocking
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "-v",
]
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "slow: Slow-running tests",
]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false  # Start lenient, can tighten later
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
strict_equality = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
check_untyped_defs = false

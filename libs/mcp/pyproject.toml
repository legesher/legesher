[project]
name = "legesher-mcp"
version = "0.1.0"
description = "Model Context Protocol (MCP) server for the Legesher translation engine"
readme = "README.md"
requires-python = ">=3.10,<4.0"
license = {text = "Apache-2.0"}
authors = [
    {name = "Madison (Pfaff) Edgar", email = "7844510+madiedgar@users.noreply.github.com"}
]
keywords = [
    "legesher", "mcp", "model-context-protocol", "python", "translation", "i18n",
    "localization", "multilingual", "language-packs", "round-trip",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

dependencies = [
    "mcp>=1.16.0,<2.0.0",  # Official MCP Python SDK (FastMCP server, stdio transport)
    "pydantic>=2.5.0",
    # Sibling ranges ship in the wheel metadata; in-repo the workspace override
    # in [tool.uv.sources] applies. <1.0.0 because semantic-release
    # (major_on_zero = true) moves 0.x to 1.0 on a breaking change.
    # FLOOR IS STALE post-carve: server.py imports compare_key from
    # legesher_core.text_identity, which lands in the first release AFTER
    # 0.23.0 — and the map removal is a breaking change that moves core past
    # the <1.0.0 cap at release (major_on_zero). Restamp both bounds when
    # semantic-release cuts that version (rides CORE-626 / CORE-1598). The
    # workspace override hides this locally; wheel metadata is what enforces it.
    "legesher-core>=0.23.0,<1.0.0",  # Translation engine (token translator, pack-backed factory)
    "legesher-i18n>=0.22.0,<1.0.0",  # Language registry + language pack loader
]

[project.urls]
Homepage = "https://legesher.io"
Repository = "https://github.com/legesher/legesher"
Changelog = "https://github.com/legesher/legesher/blob/main/libs/mcp/CHANGELOG.md"
Issues = "https://github.com/legesher/legesher/issues"

[tool.uv.sources]
legesher-core = { workspace = true }
legesher-i18n = { workspace = true }

[project.scripts]
legesher-mcp = "legesher_mcp.__main__:main"

[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"

[tool.pdm]
distribution = true

# legesher-mcp releases on its OWN train, not with the foundation suite —
# the language-pack model (CORE-1122), not the core/i18n/legesher one. It is
# earlier in its life than the foundation packages and should not inherit
# their version number, nor bump every time they release.
[tool.semantic_release]
# The single version source. `legesher_mcp.__version__` deliberately has no
# entry here: it reads importlib.metadata at import (CORE-1749), so there is
# no literal to rewrite and nothing that can drift from this file.
#
# Paths are relative to the GIT ROOT, not to this file — semantic-release
# resolves `repo_dir` by walking up to `.git/` and resolves every path
# against that. A bare "pyproject.toml" here silently reads and rewrites the
# ROOT pyproject (verified: it reported the foundation's 0.22.0 as this
# package's last release). Same reason `changelog_file` is spelled out below.
version_toml = ["libs/mcp/pyproject.toml:project.version"]
# server.json, the official MCP registry manifest, repeats the version twice
# (top level and in the PyPI package entry). Both must equal the project
# version at submission and tests/test_registry_manifest.py pins them, so
# the release step rewrites them too. The quoted key is deliberate: the
# pattern matches every `"version": "x.y.z"` in the JSON file.
version_variables = ['libs/mcp/server.json:"version"']
commit_parser = "conventional"
# The release commit's subject. PSR's default is the bare version, which the
# `chore(release)` skip in release-mcp.yml and ci.yml never matched, so every
# release retriggered its own train once (CORE-1852).
commit_message = "chore(release): legesher-mcp {version}"
# false, unlike the foundation suite: a breaking change takes 0.1.0 to 0.2.0
# and the package stays sub-1.0 until 1.0 is declared deliberately.
major_on_zero = false
allow_zero_version = true
tag_format = "mcp-v{version}"
# Same reason as the root config: semantic-release's default author is a
# bare word with no `@`, which downstream author-validating tooling rejects.
commit_author = "github-actions[bot] <github-actions[bot]@users.noreply.github.com>"

[tool.semantic_release.commit_parser_options]
allowed_tags = [
    "feat", "fix", "docs", "style", "refactor",
    "perf", "test", "build", "ci", "chore", "revert"
]
minor_tags = ["feat"]
patch_tags = ["fix", "perf"]
# The `conventional` parser is the renamed `angular` one (removed in PSR 11),
# with two defaults flipped. Pinned so the sweep changes no bump: a squash
# body that lists feat/fix lines still counts as the one commit it is.
parse_squash_commits = false
ignore_merge_commits = false

# PSR 10 reads these two from this table and ignores the top-level spellings
# (`upload_to_vcs_release`, `upload_to_pypi`) the config used to carry. It
# never uploads to PyPI: publish-pypi.yml owns that (CORE-626). The glob is
# where release-mcp.yml builds the wheel; the default, "dist/*", attached
# nothing to the GitHub release (CORE-1852).
[tool.semantic_release.publish]
upload_to_vcs_release = true
dist_glob_patterns = ["libs/mcp/dist/*"]

[tool.semantic_release.changelog]
exclude_commit_patterns = [
    "^chore\\(release\\):",
    "^Merge",
]

# The workflow passes --no-changelog: this repo's changelogs are hand-written
# and stamped by scripts/stamp-changelog-release.py, not generated. This
# setting is the guard for a manual run that forgets the flag — without it
# semantic-release defaults to the repo-root CHANGELOG.md and would rewrite
# the foundation suite's changelog during an mcp release.
[tool.semantic_release.changelog.default_templates]
changelog_file = "libs/mcp/CHANGELOG.md"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "mypy>=1.8.0",
    "ruff>=0.1.0",
]

# Async tests ride anyio's own pytest plugin (anyio ships with the mcp SDK):
# pytest-asyncio's fixture finalizers run in a separate task, which breaks
# the SDK session helpers' anyio cancel scopes.
[tool.pytest.ini_options]
testpaths = ["tests"]
# `scheduled` is deselected by default: those suites are correct but slow
# (all packs × the round-trip corpus, wheel builds into fresh venvs).
# Run them with `-m scheduled`, or `make test-mcp-scheduled`.
addopts = "-v -m 'not scheduled'"
markers = [
    "scheduled: slow, release-tier suites — excluded from the per-commit run",
]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = []

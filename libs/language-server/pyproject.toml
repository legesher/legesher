[project]
name = "legesher-language-server"
version = "0.1.3"
description = "Language Server Protocol implementation for multilingual Python programming"
readme = "README.md"
requires-python = ">=3.10,<4.0"
license = {text = "Apache-2.0"}
authors = [
    {name = "Madison (Pfaff) Edgar", email = "7844510+madiedgar@users.noreply.github.com"}
]
keywords = ["legesher", "multilingual", "programming", "lsp", "language-server"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

dependencies = [
    "pygls>=2.0.0,<3.0.0",  # Migrated to pygls 2.0 API (CORE-448)
    "pydantic>=2.5.0",
    "lru-dict>=1.3.0",
    "pyyaml>=6.0.0",  # For loading language pack YAML files
    # Sibling range ships in the wheel metadata; in-repo the workspace
    # override in [tool.uv.sources] applies. <1.0.0 because semantic-release
    # (major_on_zero = true) moves 0.x to 1.0 on a breaking change.
    "legesher-i18n>=0.22.0,<1.0.0",  # Language pack loading (CORE-450)
]

[tool.uv.sources]
legesher-i18n = { workspace = true }

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "pytest-benchmark>=4.0.0",
    "mypy>=1.5.0",
    "ruff>=0.1.0",
]

[project.scripts]
legesher-lsp = "legesher_language_server.__main__:main"

[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"

[tool.pdm]
distribution = true

[tool.pdm.dev-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "pytest-benchmark>=4.0.0",
    "mypy>=1.5.0",
    "ruff>=0.1.0",
]

# legesher-language-server releases on its OWN train, the same model as
# legesher-mcp (CORE-1851), not with the foundation suite. Editors other than
# VS Code install it themselves (CORE-2294), so it ships to PyPI on its own
# version rather than riding the foundation's (CORE-2203).
[tool.semantic_release]
# The single version source. `legesher_language_server.__version__` reads
# importlib.metadata at import, so there is no literal to rewrite here.
#
# Paths are relative to the GIT ROOT, not to this file: semantic-release
# resolves every configured path against the repository root, so a bare
# "pyproject.toml" would read and rewrite the ROOT pyproject (CORE-1852).
version_toml = ["libs/language-server/pyproject.toml:project.version"]
commit_parser = "conventional"
# The release commit's subject. PSR's default is the bare version, which the
# `chore(release)` skip in release-language-server.yml and ci.yml never
# matched, so every release retriggered its own train once (CORE-1852).
commit_message = "chore(release): legesher-language-server {version}"
# false, like the foundation and mcp: a breaking change takes 0.1.x to 0.2.0
# and the package stays sub-1.0 until 1.0 is declared deliberately.
major_on_zero = false
allow_zero_version = true
tag_format = "language-server-v{version}"
# semantic-release's default author is a bare word with no `@`, which
# downstream author-validating tooling rejects. Same override as the root.
commit_author = "github-actions[bot] <github-actions[bot]@users.noreply.github.com>"

[tool.semantic_release.commit_parser_options]
allowed_tags = [
    "feat", "fix", "docs", "style", "refactor",
    "perf", "test", "build", "ci", "chore", "revert"
]
minor_tags = ["feat"]
patch_tags = ["fix", "perf"]
# The `conventional` parser is the renamed `angular` one (removed in PSR 11),
# with two defaults flipped. Pinned so the sweep changes no bump: a squash
# body that lists feat/fix lines still counts as the one commit it is.
parse_squash_commits = false
ignore_merge_commits = false

# semantic-release 10 reads these two from this table and ignores the
# top-level spellings. It never uploads to PyPI: publish-pypi.yml owns that
# (CORE-626). The glob is where release-language-server.yml builds the wheel;
# the default, "dist/*", would attach nothing to the GitHub release.
[tool.semantic_release.publish]
upload_to_vcs_release = true
dist_glob_patterns = ["libs/language-server/dist/*"]

[tool.semantic_release.changelog]
exclude_commit_patterns = [
    "^chore\\(release\\):",
    "^Merge",
]

# The workflow passes --no-changelog: changelogs here are hand-written and
# stamped by scripts/stamp-changelog-release.py. This is the guard for a
# manual run that forgets the flag, which would otherwise rewrite the
# repo-root CHANGELOG.md during a language-server release.
[tool.semantic_release.changelog.default_templates]
changelog_file = "libs/language-server/CHANGELOG.md"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# `scheduled` is deselected by default: the clean-environment suite builds
# wheels into a fresh virtualenv, far too slow for a per-commit run. Run it
# with `-m scheduled`, or `make test-language-server-scheduled`.
addopts = "-v --cov=legesher_language_server --cov-report=term-missing -m 'not scheduled'"
markers = [
    "scheduled: slow, release-tier suites, excluded from the per-commit run",
    "timing: measures wall-clock time; bounds enforced only with --timing (make bench)",
]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = []

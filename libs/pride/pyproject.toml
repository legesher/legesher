[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"

[project]
authors = [
    {name = "Madison (Pfaff) Edgar", email = "7844510+madiedgar@users.noreply.github.com"}
]
license = {text = "LicenseRef-Proprietary"}
requires-python = ">=3.10,<4.0"
dependencies = []
name = "legesher-pride"
version = "0.0.1"
description = "community package for Legesher Monorepo"
readme = "README.md"
keywords = ["community", "portfolio", "showcase", "developer-community"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: Other/Proprietary License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development",
    "Operating System :: OS Independent",
    "Private :: Do Not Upload",
]

[tool.uv.sources]
legesher-core = { path = "../core", editable = true }
legesher-i18n = { path = "../i18n", editable = true }
legesher = { path = "../legesher", editable = true }

[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"

[project]
authors = [
    {name = "Madison (Pfaff) Edgar", email = "7844510+madiedgar@users.noreply.github.com"}
]
license = {text = "MIT"}
requires-python = ">=3.10,<4.0"
dependencies = []
name = "legesher-vs-code"
version = "0.0.1"
description = "vs code extension for Legesher Monorepo"
readme = "README.md"
keywords = ["vscode", "editor", "extension", "translation", "multilingual", "python"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Text Editors :: Integrated Development Environments",
    "Operating System :: OS Independent",
]

[tool.uv.sources]
legesher-core = { path = "../core", editable = true }
legesher-i18n = { path = "../i18n", editable = true }

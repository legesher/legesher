[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"

[project]
authors = [
    {name = "Madison (Pfaff) Edgar", email = "7844510+madiedgar@users.noreply.github.com"}
]
license = {text = "Apache-2.0"}
requires-python = ">=3.10,<4.0"
dependencies = [
    # Sibling packages are version-bumped together by semantic-release
    # (see root pyproject.toml `version_toml`), which this package does not
    # participate in. `major_on_zero = true` means a breaking change bumps
    # 0.x to 1.0, so `<1.0.0` is the compatibility boundary and minor bumps
    # resolve without touching this file. The `[tool.uv.sources]` workspace
    # override below is what applies in-repo; these ranges are what ship in
    # the wheel metadata and govern any out-of-workspace install.
    "legesher>=0.22.0,<1.0.0",
    "legesher-core>=0.22.0,<1.0.0",
]
name = "legesher-vs-code"
version = "0.1.0"
description = "Dependency bundle installing the Python side of the Legesher VS Code extension"
readme = "README.md"
keywords = ["vscode", "editor", "extension", "translation", "multilingual", "python"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Text Editors :: Integrated Development Environments",
    "Operating System :: OS Independent",
]

[tool.uv.sources]
legesher = { workspace = true }
legesher-core = { workspace = true }

[tool.semantic_release]
# No workflow runs this config: release-apps.yml tags the extension from
# package.json. It is kept valid for PSR 10 with every path relative to the
# GIT ROOT, so that a manual run can never read or rewrite the ROOT pyproject
# (CORE-1852). The old `version_variable` pointed at a file that does not exist.
version_toml = ["libs/vs-code/pyproject.toml:project.version"]
commit_parser = "conventional"
commit_message = "chore(release): legesher-vs-code {version}"
major_on_zero = true
allow_zero_version = true
tag_format = "vs-code-v{version}"
# See root pyproject.toml: overrides python-semantic-release's invalid
# default `semantic-release <semantic-release>` author so Vercel and other
# email-validating tooling accept the release commit.
commit_author = "github-actions[bot] <github-actions[bot]@users.noreply.github.com>"

[tool.semantic_release.commit_parser_options]
allowed_tags = [
    "feat", "fix", "docs", "style", "refactor",
    "perf", "test", "build", "ci", "chore", "revert"
]
parse_squash_commits = false
ignore_merge_commits = false

[tool.semantic_release.publish]
upload_to_vcs_release = true
dist_glob_patterns = ["libs/vs-code/dist/*"]

[tool.semantic_release.changelog]
exclude_commit_patterns = [
    "^chore\\(release\\):",
    "^Merge",
]

[tool.semantic_release.changelog.default_templates]
changelog_file = "libs/vs-code/CHANGELOG.md"

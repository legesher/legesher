# Arabic Language Pack for Python 3.10+
# Base pack with all core keywords and Python 3.10 additions (match/case)

language: ar
target: python
version: '3.10'

keywords:
  # Core keywords (Python 3.x)
  and: و
  as: كـ
  assert: تأكيد
  async: غيرمتزامن
  await: انتظار
  break: كسر
  class: صنف
  continue: استمرار
  def: تعريف
  del: حذف
  elif: أوإذا
  else: وإلا
  except: استثناء
  'False': خطأ
  finally: أخيرا
  for: لكل
  from: من
  global: عام
  if: إذا
  import: استيراد
  in: في
  is: يكون
  lambda: لامدا
  None: لاشيء
  nonlocal: غيرمحلي
  not: ليس
  or: أو
  pass: تجاوز
  raise: رفع
  return: إرجاع
  'True': صحيح
  try: محاولة
  while: بينما
  with: مع
  yield: إنتاج

  # Python 3.10+ specific (PEP 634: Structural Pattern Matching)
  match: مطابقة
  case: حالة

builtins:
  # Common built-in functions
  print: طباعة
  input: إدخال
  len: طول
  range: نطاق
  str: نص
  int: صحيح
  float: عشري
  list: قائمة
  dict: قاموس
  set: مجموعة
  tuple: صف
  bool: منطقي
  type: نوع
  isinstance: هومثيل
  hasattr: لديهصفة
  getattr: الحصولعلىصفة
  setattr: تعيينصفة
  open: فتح
  close: إغلاق
  read: قراءة
  write: كتابة
  sum: مجموع
  min: أدنى
  max: أقصى
  abs: مطلق
  round: تقريب
  sorted: مرتب
  reversed: معكوس
  enumerate: تعداد
  zip: ضغط
  map: خريطة
  filter: تصفية
  any: أي
  all: كل

metadata:
  python_version_min: '3.10'
  python_version_max: '3.13'
  compatibility_tested:
  - '3.10'
  - '3.11'
  - '3.12'
  - '3.13'
  last_updated: '2025-10-23'
  community_reviewed: false
  author: Legesher Team
  license: MIT

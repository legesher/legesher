[project]
name = "legesher-monorepo"
# license = {}
version = "0.18.0"
description = "Legesher Monorepo"
authors = [
    {name = "Madison (Pfaff) Edgar",email = "7844510+madiedgar@users.noreply.github.com"}
]
requires-python = ">=3.10,<4.0"
dependencies = [
    "legesher-core",
    "legesher-i18n",
    "legesher",
    "legesher-language-server",
    "legesher-vs-code",
]
readme = "README.md"

[project.urls]
repository = "https://www.github.com/legesher/legesher"

[tool.uv.workspace]
members = [
    "libs/core",
    "libs/i18n",
    "libs/i18n/language-packs/python/*",
    "libs/legesher",
    "libs/language-server",
    "libs/vs-code",
]

[tool.uv.sources]
legesher-core = { workspace = true }
legesher-i18n = { workspace = true }
legesher-i18n-python-am = { workspace = true }
legesher-i18n-python-ar = { workspace = true }
legesher-i18n-python-bn = { workspace = true }
legesher-i18n-python-bs = { workspace = true }
legesher-i18n-python-ca = { workspace = true }
legesher-i18n-python-cs = { workspace = true }
legesher-i18n-python-cy = { workspace = true }
legesher-i18n-python-da = { workspace = true }
legesher-i18n-python-de = { workspace = true }
legesher-i18n-python-el = { workspace = true }
legesher-i18n-python-en = { workspace = true }
legesher-i18n-python-es = { workspace = true }
legesher-i18n-python-fa = { workspace = true }
legesher-i18n-python-fi = { workspace = true }
legesher-i18n-python-fr = { workspace = true }
legesher-i18n-python-ga = { workspace = true }
legesher-i18n-python-gd = { workspace = true }
legesher-i18n-python-gl = { workspace = true }
legesher-i18n-python-gu = { workspace = true }
legesher-i18n-python-he = { workspace = true }
legesher-i18n-python-hi = { workspace = true }
legesher-i18n-python-hr = { workspace = true }
legesher-i18n-python-hu = { workspace = true }
legesher-i18n-python-id = { workspace = true }
legesher-i18n-python-it = { workspace = true }
legesher-i18n-python-ja = { workspace = true }
legesher-i18n-python-kn = { workspace = true }
legesher-i18n-python-ko = { workspace = true }
legesher-i18n-python-lv = { workspace = true }
legesher-i18n-python-mk = { workspace = true }
legesher-i18n-python-ml = { workspace = true }
legesher-i18n-python-mn = { workspace = true }
legesher-i18n-python-ms = { workspace = true }
legesher-i18n-python-my = { workspace = true }
legesher-i18n-python-nl = { workspace = true }
legesher-i18n-python-no = { workspace = true }
legesher-i18n-python-pl = { workspace = true }
legesher-i18n-python-pt = { workspace = true }
legesher-i18n-python-ro = { workspace = true }
legesher-i18n-python-ru = { workspace = true }
legesher-i18n-python-si = { workspace = true }
legesher-i18n-python-sr = { workspace = true }
legesher-i18n-python-su = { workspace = true }
legesher-i18n-python-sv = { workspace = true }
legesher-i18n-python-te = { workspace = true }
legesher-i18n-python-th = { workspace = true }
legesher-i18n-python-tr = { workspace = true }
legesher-i18n-python-ur = { workspace = true }
legesher-i18n-python-uz = { workspace = true }
legesher-i18n-python-vi = { workspace = true }
legesher-i18n-python-zh = { workspace = true }
legesher = { workspace = true }
legesher-language-server = { workspace = true }
legesher-vs-code = { workspace = true }

[dependency-groups]
dev = [
    "pre-commit>=4.6.0",
    "ruff>=0.15.12",
    "black>=24.0.0",
    "mypy>=1.20.2",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.2.0",
    "pytest-cov>=7.0.0",
    "pytest-benchmark>=4.0.0",
    "python-semantic-release>=9.0.0",
    "commitizen>=4.13.10",
    "datasets>=4.8.5",
    "huggingface-hub>=1.12.0",
    "psutil>=7.2.2",
    "vulture>=2.16",
]

[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"

[tool.semantic_release]
# Foundation suite configuration (core, i18n, legesher)
version_variables = [
    "libs/core/legesher_core/__init__.py:__version__",
    "libs/i18n/legesher_i18n/__init__.py:__version__",
    "libs/legesher/legesher/__init__.py:__version__",
]

version_toml = [
    "pyproject.toml:project.version",
    "libs/core/pyproject.toml:project.version",
    "libs/i18n/pyproject.toml:project.version",
    "libs/legesher/pyproject.toml:project.version",
]

commit_parser = "angular"
major_on_zero = true
allow_zero_version = true
branch = "main"
tag_format = "v{version}"
build_command = "uv build"
upload_to_vcs_release = true
upload_to_pypi = false
# Override python-semantic-release's hardcoded default of
# `semantic-release <semantic-release>`. That bare-word author has no `@`,
# so downstream tooling that validates commit authors (Vercel deploy gating,
# etc.) rejects the release commit. The workflow's `git config user.email`
# only affects shell-driven commits — semantic-release uses its own author.
commit_author = "github-actions[bot] <github-actions[bot]@users.noreply.github.com>"

# Filter to foundation packages only
[tool.semantic_release.commit_parser_options]
allowed_tags = [
    "feat", "fix", "docs", "style", "refactor",
    "perf", "test", "build", "ci", "chore", "revert"
]

[tool.semantic_release.changelog]
exclude_commit_patterns = [
    "^chore\\(release\\):",
    "^Merge",
]

[tool.ruff]
exclude = [
    "libs/legesher/examples/*",  # Demo files may use native language keywords
]

[tool.ruff.lint]
# Ruff default rules (E4, E7, E9, F) plus pyupgrade (UP) for modern Python syntax.
# UP rules replace the standalone pyupgrade tool — they enforce Python 3.10+ idioms
# like `X | None` over `Optional[X]`, `list[str]` over `List[str]`, etc.
select = ["E4", "E7", "E9", "F", "UP"]
# Allow undefined names in demo files that intentionally trigger errors
per-file-ignores = { "libs/legesher/examples/*" = ["F821"] }

[tool.bandit]
# Security linting for Python source. Run via `uv run bandit -r libs/ -c pyproject.toml`.
# Integrated in CI via .github/workflows/security.yml.
exclude_dirs = [
    "tests",
    ".venv",
    "libs/i18n/language-packs",
    "libs/i18n/language-packs-archive",
    "libs/legesher/examples",
    "libs/vs-code/.vscode-test",  # Downloaded VS Code test fixtures, not our code
    "libs/core/htmlcov",           # pytest-cov HTML output
]
skips = [
    "B101",  # assert_used — asserts are common/safe in non-test code too
]

[tool.commitizen]
name = "cz_conventional_commits"
version = "0.1.0"
version_files = [
    "pyproject.toml:project.version",
    "libs/core/pyproject.toml:project.version",
    "libs/i18n/pyproject.toml:project.version",
    "libs/legesher/pyproject.toml:project.version",
]
style = [
    ["qmark", "fg:#ff9d00 bold"],
    ["question", "bold"],
    ["answer", "fg:#ff9d00 bold"],
    ["pointer", "fg:#ff9d00 bold"],
    ["highlighted", "fg:#ff9d00 bold"],
    ["selected", "fg:#cc5454"],
    ["separator", "fg:#cc5454"],
    ["instruction", ""],
    ["text", ""],
    ["disabled", "fg:#858585 italic"]
]

# Match semantic-release configuration
[tool.commitizen.customize]
message_template = "{{change_type}}{% if scope %}({{scope}}){% endif %}{% if is_breaking_change %}!{% endif %}: {{message}}"
schema_pattern = "^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\\([a-z0-9-]+\\))?!?: .{1,88}"

[[tool.commitizen.customize.questions]]
type = "list"
name = "change_type"
message = "Select the type of change you are committing:"
choices = [
    {value = "feat", name = "feat: A new feature"},
    {value = "fix", name = "fix: A bug fix"},
    {value = "docs", name = "docs: Documentation only changes"},
    {value = "style", name = "style: Code style changes (formatting, etc)"},
    {value = "refactor", name = "refactor: Code change that neither fixes a bug nor adds a feature"},
    {value = "perf", name = "perf: Performance improvement"},
    {value = "test", name = "test: Adding or updating tests"},
    {value = "build", name = "build: Build system or external dependencies"},
    {value = "ci", name = "ci: CI/CD configuration changes"},
    {value = "chore", name = "chore: Other changes that don't modify src or test files"},
    {value = "revert", name = "revert: Revert a previous commit"},
]

[[tool.commitizen.customize.questions]]
type = "input"
name = "scope"
message = "Scope (package name: core, i18n, legesher, language-server, vs-code, i18n-python-ar, i18n-python-es, i18n-python-en, i18n-python-fr, i18n-python-zh) [optional]:"

[[tool.commitizen.customize.questions]]
type = "input"
name = "message"
message = "Short description of the change:"

[[tool.commitizen.customize.questions]]
type = "confirm"
name = "is_breaking_change"
message = "Is this a BREAKING CHANGE?"
default = false

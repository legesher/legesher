[project]
name = "legesher-monorepo"
# license = {}
version = "0.4.0"
description = "Legesher Monorepo"
authors = [
    {name = "Madison (Pfaff) Edgar",email = "7844510+madiedgar@users.noreply.github.com"}
]
requires-python = ">=3.10,<4.0"
dependencies = []
readme = "README.md"

[project.urls]
repository = "https://www.github.com/legesher/legesher"

[tool.uv.sources]
legesher-core = { path = "./libs/core", editable = true }
legesher-i18n = { path = "./libs/i18n", editable = true }
legesher-i18n-python-ar = { path = "./libs/i18n/language-packs/python/ar", editable = true }
legesher-i18n-python-da = { path = "./libs/i18n/language-packs/python/da", editable = true }
legesher-i18n-python-de = { path = "./libs/i18n/language-packs/python/de", editable = true }
legesher-i18n-python-el = { path = "./libs/i18n/language-packs/python/el", editable = true }
legesher-i18n-python-en = { path = "./libs/i18n/language-packs/python/en", editable = true }
legesher-i18n-python-es = { path = "./libs/i18n/language-packs/python/es", editable = true }
legesher-i18n-python-fi = { path = "./libs/i18n/language-packs/python/fi", editable = true }
legesher-i18n-python-fr = { path = "./libs/i18n/language-packs/python/fr", editable = true }
legesher-i18n-python-he = { path = "./libs/i18n/language-packs/python/he", editable = true }
legesher-i18n-python-hi = { path = "./libs/i18n/language-packs/python/hi", editable = true }
legesher-i18n-python-hu = { path = "./libs/i18n/language-packs/python/hu", editable = true }
legesher-i18n-python-id = { path = "./libs/i18n/language-packs/python/id", editable = true }
legesher-i18n-python-it = { path = "./libs/i18n/language-packs/python/it", editable = true }
legesher-i18n-python-ja = { path = "./libs/i18n/language-packs/python/ja", editable = true }
legesher-i18n-python-ko = { path = "./libs/i18n/language-packs/python/ko", editable = true }
legesher-i18n-python-ms = { path = "./libs/i18n/language-packs/python/ms", editable = true }
legesher-i18n-python-nl = { path = "./libs/i18n/language-packs/python/nl", editable = true }
legesher-i18n-python-no = { path = "./libs/i18n/language-packs/python/no", editable = true }
legesher-i18n-python-pl = { path = "./libs/i18n/language-packs/python/pl", editable = true }
legesher-i18n-python-pt = { path = "./libs/i18n/language-packs/python/pt", editable = true }
legesher-i18n-python-ru = { path = "./libs/i18n/language-packs/python/ru", editable = true }
legesher-i18n-python-sv = { path = "./libs/i18n/language-packs/python/sv", editable = true }
legesher-i18n-python-th = { path = "./libs/i18n/language-packs/python/th", editable = true }
legesher-i18n-python-tr = { path = "./libs/i18n/language-packs/python/tr", editable = true }
legesher-i18n-python-vi = { path = "./libs/i18n/language-packs/python/vi", editable = true }
legesher-i18n-python-zh = { path = "./libs/i18n/language-packs/python/zh", editable = true }
legesher = { path = "./libs/legesher", editable = true }
legesher-language-server = { path = "./libs/language-server", editable = true }
legesher-home = { path = "./libs/home", editable = true }
legesher-vs-code = { path = "./libs/vs-code", editable = true }

[dependency-groups]
dev = [
    "pre-commit>=3.5.0",
    "ruff>=0.1.0",
    "black>=24.0.0",
    "mypy>=1.8.0",
    "pytest>=8.4.2",
    "pytest-asyncio>=1.2.0",
    "pytest-cov>=7.0.0",
    "python-semantic-release>=9.0.0",
    "commitizen>=4.9.1",
]

[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"

[tool.semantic_release]
# Foundation suite configuration (core, i18n, legesher)
version_variables = [
    "libs/core/legesher_core/__init__.py:__version__",
    "libs/i18n/legesher_i18n/__init__.py:__version__",
    "libs/legesher/legesher/__init__.py:__version__",
]

version_toml = [
    "pyproject.toml:project.version",
    "libs/core/pyproject.toml:project.version",
    "libs/i18n/pyproject.toml:project.version",
    "libs/legesher/pyproject.toml:project.version",
]

commit_parser = "angular"
major_on_zero = true
allow_zero_version = true
branch = "main"
tag_format = "v{version}"
build_command = "uv build"
upload_to_vcs_release = true
upload_to_pypi = false

# Filter to foundation packages only
[tool.semantic_release.commit_parser_options]
allowed_tags = [
    "feat", "fix", "docs", "style", "refactor",
    "perf", "test", "build", "ci", "chore", "revert"
]

[tool.semantic_release.changelog]
exclude_commit_patterns = [
    "^chore\\(release\\):",
    "^Merge",
]

[tool.ruff]
exclude = [
    "libs/legesher/examples/*",  # Demo files may use native language keywords
]

[tool.ruff.lint]
# Allow undefined names in demo files that intentionally trigger errors
per-file-ignores = { "libs/legesher/examples/*" = ["F821"] }

[tool.commitizen]
name = "cz_conventional_commits"
version = "0.1.0"
version_files = [
    "pyproject.toml:project.version",
    "libs/core/pyproject.toml:project.version",
    "libs/i18n/pyproject.toml:project.version",
    "libs/legesher/pyproject.toml:project.version",
]
style = [
    ["qmark", "fg:#ff9d00 bold"],
    ["question", "bold"],
    ["answer", "fg:#ff9d00 bold"],
    ["pointer", "fg:#ff9d00 bold"],
    ["highlighted", "fg:#ff9d00 bold"],
    ["selected", "fg:#cc5454"],
    ["separator", "fg:#cc5454"],
    ["instruction", ""],
    ["text", ""],
    ["disabled", "fg:#858585 italic"]
]

# Match semantic-release configuration
[tool.commitizen.customize]
message_template = "{{change_type}}{% if scope %}({{scope}}){% endif %}{% if is_breaking_change %}!{% endif %}: {{message}}"
schema_pattern = "^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\\([a-z0-9-]+\\))?!?: .{1,88}"

[[tool.commitizen.customize.questions]]
type = "list"
name = "change_type"
message = "Select the type of change you are committing:"
choices = [
    {value = "feat", name = "feat: A new feature"},
    {value = "fix", name = "fix: A bug fix"},
    {value = "docs", name = "docs: Documentation only changes"},
    {value = "style", name = "style: Code style changes (formatting, etc)"},
    {value = "refactor", name = "refactor: Code change that neither fixes a bug nor adds a feature"},
    {value = "perf", name = "perf: Performance improvement"},
    {value = "test", name = "test: Adding or updating tests"},
    {value = "build", name = "build: Build system or external dependencies"},
    {value = "ci", name = "ci: CI/CD configuration changes"},
    {value = "chore", name = "chore: Other changes that don't modify src or test files"},
    {value = "revert", name = "revert: Revert a previous commit"},
]

[[tool.commitizen.customize.questions]]
type = "input"
name = "scope"
message = "Scope (package name: core, i18n, legesher, language-server, vs-code, home, i18n-python-ar, i18n-python-es, i18n-python-en, i18n-python-fr, i18n-python-zh) [optional]:"

[[tool.commitizen.customize.questions]]
type = "input"
name = "message"
message = "Short description of the change:"

[[tool.commitizen.customize.questions]]
type = "confirm"
name = "is_breaking_change"
message = "Is this a BREAKING CHANGE?"
default = false
